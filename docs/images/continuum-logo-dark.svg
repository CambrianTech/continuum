<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" style="background:#0a0a1a;border-radius:50%" width="512" height="512">
  <defs>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    <filter id="glow-strong" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="15" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  
  <!-- Outer ring glow -->
  <circle cx="256" cy="256" r="220" fill="none" stroke="#00d4ff" stroke-width="3" opacity="0.3" filter="url(#glow-strong)"/>
  
  <!-- Outer ring -->
  <circle cx="256" cy="256" r="220" fill="none" stroke="#00d4ff" stroke-width="6" opacity="0.9" filter="url(#glow)"/>
  
  <!-- Inner ring glow -->
  <circle cx="256" cy="256" r="155" fill="none" stroke="#00d4ff" stroke-width="3" opacity="0.3" filter="url(#glow-strong)"/>
  
  <!-- Inner ring -->
  <circle cx="256" cy="256" r="155" fill="none" stroke="#00d4ff" stroke-width="8" opacity="0.9" filter="url(#glow)"/>
  
  <!-- Subtle grid lines (Tron aesthetic) -->
  <line x1="256" y1="20" x2="256" y2="492" stroke="#00d4ff" stroke-width="0.5" opacity="0.1"/>
  <line x1="20" y1="256" x2="492" y2="256" stroke="#00d4ff" stroke-width="0.5" opacity="0.1"/>
  <line x1="90" y1="90" x2="422" y2="422" stroke="#00d4ff" stroke-width="0.3" opacity="0.07"/>
  <line x1="422" y1="90" x2="90" y2="422" stroke="#00d4ff" stroke-width="0.3" opacity="0.07"/>
</svg>