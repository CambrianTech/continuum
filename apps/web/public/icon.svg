<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="continuum">
  <!-- The CONTINUON — the fourth-wall being (the emoting green orb), the persona's
       touch into the interface (docs/CONVERSATIONAL-CADENCE-ARCHITECTURE.md). The
       orb IS the subject; the cyan ring is its threshold. -->
  <rect width="512" height="512" rx="112" fill="#16161a"/>
  <defs>
    <radialGradient id="orb" cx="42%" cy="38%" r="70%">
      <stop offset="0%" stop-color="#8dffc4"/>
      <stop offset="45%" stop-color="#39d98a"/>
      <stop offset="100%" stop-color="#1a7a4c"/>
    </radialGradient>
    <radialGradient id="halo" cx="50%" cy="50%" r="50%">
      <stop offset="60%" stop-color="#39d98a" stop-opacity="0"/>
      <stop offset="100%" stop-color="#39d98a" stop-opacity="0.35"/>
    </radialGradient>
  </defs>
  <circle cx="256" cy="256" r="196" fill="url(#halo)"/>
  <circle cx="256" cy="256" r="188" fill="none" stroke="#40e0ff" stroke-width="14" opacity="0.5"/>
  <circle cx="256" cy="256" r="122" fill="url(#orb)"/>
  <circle cx="214" cy="212" r="34" fill="#ffffff" opacity="0.28"/>
</svg>
