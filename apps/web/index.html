<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <!-- Mobile app-layer (PWA): the same positron web template, installable + standalone
         on a phone. First mobile surface on the one app template; Tauri-mobile native
         shell is the next app layer. [[joel-crossplatform-native-background]] -->
    <meta name="theme-color" content="#16161a" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="continuum" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="apple-touch-icon" href="/icon.svg" />
    <!-- Brand is always lowercase: "continuum" (Joel 2026-07-30). -->
    <title>continuum</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #16161a;
      }
      /* The single mount. index.ts replaces its children with <chat-widget>,
         which fills it via a 100% grid — so the three panels own the viewport. */
      #app {
        height: 100vh;
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/index.ts"></script>
  </body>
</html>
