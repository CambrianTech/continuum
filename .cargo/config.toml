# Workspace-level cargo configuration.
#
# Per build-time doctrine card 424deb5e (slices 1+2): opt-in compile
# accelerators. Everything in this file is COMMENTED by default —
# uncomment after installing the relevant tool. Per
# [[organization-purity-as-we-migrate]] + [[no-fallbacks-ever]]: we
# don't ship configuration that silently fails to work better. If a
# dev hasn't installed sccache, the wrapper line shouldn't break their
# build by referencing a binary that isn't on PATH.
#
# To opt into ALL accelerators on your machine:
#   1. brew install sccache             (or: cargo install sccache)
#   2. brew install llvm                (for lld on macOS)
#      OR sudo apt install mold         (for mold on Linux)
#   3. Uncomment the relevant blocks below.
#
# Verify after opt-in:
#   - sccache --show-stats
#   - cargo build -v 2>&1 | grep -E 'sccache|mold|lld'

# ─── Slice 1: sccache (rustc-level distributed cache) ────────────────
#
# Caches rustc output keyed by (compiler version, source hash, flags).
# Biggest win for the airc work claim flow: each worktree has its own
# target/, but sccache backs them with one shared on-disk cache. Hit
# rates of 80-95% on common changes; cold target/ feels warm.
#
# Default backend is ~/.cache/sccache (local disk). For team-shared
# cache later: set SCCACHE_BUCKET=<s3-bucket> + standard AWS env vars,
# OR SCCACHE_GHA_ENABLED=on in CI (uses GitHub Actions cache).
#
# Uncomment after `cargo install sccache` or `brew install sccache`:
# [build]
# rustc-wrapper = "sccache"

# ─── Slice 2: Linker selection (mold on Linux, lld on macOS) ─────────
#
# The final link step is single-threaded by default and burns 30-60s
# per build on this codebase (vendored llama.cpp + candle + tokio +
# all the substrate crates). mold (Linux) or lld (macOS / Linux)
# cut that to 2-5s. Drop-in replacement via -fuse-ld linker flag.
#
# Uncomment the block for YOUR platform:

# macOS arm64 (M-series) — lld via brew install llvm
# [target.aarch64-apple-darwin]
# linker = "clang"
# rustflags = ["-C", "link-arg=-fuse-ld=lld"]

# macOS x86_64 (Intel Mac) — lld via brew install llvm
# [target.x86_64-apple-darwin]
# linker = "clang"
# rustflags = ["-C", "link-arg=-fuse-ld=lld"]

# Linux x86_64 — mold (best) via apt install mold
# [target.x86_64-unknown-linux-gnu]
# linker = "clang"
# rustflags = ["-C", "link-arg=-fuse-ld=mold"]

# Linux arm64 — mold via apt install mold
# [target.aarch64-unknown-linux-gnu]
# linker = "clang"
# rustflags = ["-C", "link-arg=-fuse-ld=mold"]

# ─── Slice 3: shared CARGO_TARGET_DIR across airc worktrees ──────────
#
# Per [[local-worktree-is-temp-dir]] + the disk-full incident on
# 2026-06-05 (a stuck Docker daemon mid-build cascaded into 100% disk
# usage; root cause was each airc worktree carrying its own 5-10 GB
# target/ dir × ~10 worktrees = 50-100 GB of dev artifact sprawl).
#
# Collapse N target/ dirs into ONE shared `~/.airc/cargo-target`. Each
# airc worktree compiles into and reads from the same target tree.
#
# Trade-offs (open about them; cargo's lock semantics are real):
#   - Sequential builds only — concurrent `cargo build` invocations
#     across worktrees will serialize on the shared target lock. For
#     the typical one-PR-at-a-time flow this is invisible.
#   - Branch-switch rebuilds when Cargo.lock changes (different
#     dependency sets need different artifacts). Cargo handles this
#     by rebuilding the affected crates; the cache absorbs the rest.
#   - Composes with slice 1 (sccache caches rustc invocations) and
#     slice 2 (linker selection) — all three slices stack.
#
# Why this is config and not env-only: putting CARGO_TARGET_DIR in
# .cargo/config.toml [env] section makes the policy travel with the
# worktree, so `airc work claim` → `cd worktree` → `cargo test` Just
# Works without remembering to export anything.
#
# Why opt-in (commented): single-target-dir is a tradeoff, not a
# universal win. Devs with one-worktree-only flows lose nothing by
# leaving it off; devs juggling many concurrent airc worktrees gain
# the most by turning it on. Per [[no-fallbacks-ever]] + the
# slice-1/slice-2 doctrine: ship the lever, document the trade, let
# operators choose.
#
# To opt in:
#   1. mkdir -p ~/.airc/cargo-target
#   2. Uncomment the [env] block below.
#   3. Optionally: scripts/airc-shared-target-opt-in.sh wires this
#      into every existing airc worktree's local config.
#
# Verify after opt-in:
#   - cargo build -v 2>&1 | grep -E '(Compiling|Finished) .* in '
#   - du -sh ~/.airc/cargo-target/   # one shared tree, not N
#   - du -sh ~/.airc/worktrees/*/core/target  # should be empty/absent
#
# [env]
# CARGO_TARGET_DIR = { value = "/Users/YOUR-USERNAME/.airc/cargo-target", force = false }
#
# Note on the absolute path: cargo config does NOT expand `~` or
# environment variables in [env] values (cargo issue #14149). The
# `force = false` lets a per-shell CARGO_TARGET_DIR export override
# this — useful for one-shot builds against a clean target.

# ─── windows-msvc: static CRT (/MT) to match the prebuilt libwebrtc ─────────
#
# ACTIVE (not opt-in): a correctness fix, not an accelerator. See
# docs/architecture/GPU-CONTRACT.md. The no-compromise GPU build keeps livekit,
# which links a PREBUILT `webrtc.lib` that Google/LiveKit ship built /MT (static
# CRT) — it cannot be recompiled /MD short of building libwebrtc from source. A
# single object with a different RuntimeLibrary is a hard link failure:
#   LNK2038: mismatch detected for 'RuntimeLibrary': value 'MT_StaticRelease'
#            doesn't match value 'MD_DynamicRelease'   →   LNK1319
# So the WHOLE windows-msvc build is /MT: `+crt-static` makes Rust link LIBCMT,
# and the cc crate then compiles every from-source C/C++ dep (basis-universal,
# ring, sqlite, …) /MT automatically because it honors this feature. esaxx-rs
# already hardcodes `.static_crt(true)` → /MT, which is now CORRECT (no override
# needed — that's why the old CFLAGS/CXXFLAGS=-MD hack is gone). llama.cpp reads
# the same feature in core/llama/build.rs (CMAKE_MSVC_RUNTIME_LIBRARY). Now every
# object is MT_StaticRelease, matching libwebrtc.
#
# Off windows-msvc this section does not apply (target-scoped), so Linux/macOS
# builds are unaffected. If a /MD prebuilt (e.g. a static MKL) is ever pulled
# into a windows-msvc build it will re-surface LNK2038 — drop that dep's mkl-style
# feature (a CUDA build doesn't need candle's CPU BLAS) rather than weakening this.
[target.x86_64-pc-windows-msvc]
rustflags = ["-C", "target-feature=+crt-static"]
