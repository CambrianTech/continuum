# Continuum Rust Workspace
#
# Single workspace spans every Rust crate in the repo, grouped by tier:
#   core/      — headless substrate (server-side)
#   client/    — shared client lib (consumed by CLI + mobile FFI bridges)
#   apps/      — thin app shells (CLI today; mobile/desktop/vr land here)
#
# Add new crates to the members list below under their owning tier.

[workspace]
resolver = "2"
members = [
    # core/ — rust substrate
    "core/archive",
    "core/continuum-core",
    "core/continuum-orm-derive",
    "core/inference-grpc",
    "core/jtag-mcp",
    "core/livekit-bridge",
    "core/livekit-protocol",
    "core/llama",

    # client/ — shared client lib (consumed by CLI + mobile SDK FFI)
    "client/continuum-client",
]
# Shared dependencies - workers inherit these versions
[workspace.dependencies]
# airc substrate — git-pinned to a stable SHA for efficient-passthrough
# integration (CBOR over Unix-socket IPC, no JSON re-encoding in the
# hot path, byte-stable for ed25519 sig verify on L1-6 envelopes).
# airc-ipc pulls airc-protocol + airc-core transitively. Bump the rev
# when adopting an airc change; all crates resolve from the same
# checkout so the IPC ABI version (IPC_PROTOCOL_VERSION) stays
# consistent across the dependency graph.
#
# 2026-05-31 bump 428f9281 → 5f6e25f: adopts airc v5 owner-core
# rewrite (continuum task #82, headless break #3) AND the SDK-side
# `impl From<>` conversions from airc#1096. Schema changes this PR
# migrates daemon_transport.rs against:
#   - Response::Event: { event: Box<TranscriptEvent> } → { envelope: Vec<u8> }
#     (decoded via `airc_lib::decode_wire_event`)
#   - PublishRequest: + from_peer/from_client/payload, − wire/body
#   - InboxResponse: { events: Vec<TranscriptEvent> } → { envelopes: Vec<Vec<u8>> }
#   - InboxRequest.since: TranscriptCursor → IpcCursor (via .into())
#   - PublishRequest.kind: FrameKind → IpcKind (via .into())
#   - PublishRequest.target: MentionTarget → IpcTarget (via .into())
#   - ResolveWire removed (owner-core daemon owns channels)
#
# All on same SHA so IPC ABI version stays consistent. The pinned
# SHA is currently the tip of the unmerged airc PR branch (#1095 +
# #1096); re-pin to the post-merge SHA on airc canary/rust-rewrite
# before merging this continuum PR past canary.
airc-core = { git = "https://github.com/CambrianTech/airc", rev = "f6ed190" }
airc-protocol = { git = "https://github.com/CambrianTech/airc", rev = "f6ed190" }
airc-ipc = { git = "https://github.com/CambrianTech/airc", rev = "f6ed190" }
airc-lib = { git = "https://github.com/CambrianTech/airc", rev = "f6ed190" }
airc-wire = { git = "https://github.com/CambrianTech/airc", rev = "f6ed190" }

# Candle ML framework — patched via [patch.crates-io] below.
# Fixes: Metal buffer pool leak (#2271), RoPE NEOX convention (#3410)
candle-core = { version = "0.9" }
candle-nn = { version = "0.9" }
candle-transformers = { version = "0.9" }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Database
rusqlite = { version = "0.38", features = ["bundled"] }

# Async runtime
tokio = { version = "1", features = ["full"] }

# gRPC
tonic = "0.14"
prost = "0.14"
tokio-stream = "0.1"

# Timing and UUIDs (for JTAG protocol)
chrono = "0.4"
uuid = { version = "1.6", features = ["v4", "serde"] }

# Safetensors for model/adapter weights
safetensors = "0.7"

# Half-precision floats (f16, bf16)
half = "2.7"

# Byte slice casting (for safetensors -> tensor conversion)
bytemuck = { version = "1.14", features = ["derive"] }

# HuggingFace Hub for model downloads
hf-hub = "0.5"

# Tokenization
tokenizers = "0.22"

# Random number generation
rand = "0.8"

# Parallelism
rayon = "1.11"

# Type generation (Rust → TypeScript)
ts-rs = "12.0"

# Postgres
deadpool-postgres = "0.14"
tokio-postgres = { version = "0.7", features = ["with-serde_json-1", "with-chrono-0_4"] }

# Compression and hashing
flate2 = "1.0"
sha2 = "0.10"

# Thread-safe primitives
lazy_static = "1.5"
once_cell = "1.21"
parking_lot = "0.12"

# Async utilities
async-trait = "0.1"

# Error handling
thiserror = "2"

# Logging/tracing
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
# Rolling-file writer for the fmt layer so operators don't need to
# remember to `2>/dev/null`. Pinned to 0.2 — Builder::max_log_files
# (used in routing/tracing_init.rs) requires ≥0.2.4. See
# `[[never-redirect-substrate-stderr]]` doctrine memory for why.
tracing-appender = "0.2"

# Embedding (fastembed)
fastembed = "5"

# ONNX Runtime for TTS and embedding inference.
# download-binaries: downloads prebuilt ORT. load-dynamic: loads as shared lib at runtime.
# load-dynamic avoids protobuf symbol conflict with livekit/webrtc-sys that crashes
# cargo test on Linux (SIGABRT in protobuf descriptor registration).
# Both features together = download the binary AND load dynamically (no static protobuf link).
ort = { version = "2.0.0-rc.11", default-features = false, features = ["download-binaries", "load-dynamic", "ndarray"] }
ndarray = "0.17"  # ort 2.0.0-rc.11 requires ndarray 0.17 for OwnedTensorArrayData trait compatibility

# WebSocket
tokio-tungstenite = "0.28"
futures-util = "0.3"

# Edge-TTS (Microsoft Edge Read Aloud API — free, no API key)
msedge-tts = "0.3"


# Protobuf symbol conflict (ort vs webrtc-sys) is fixed by module declaration
# order in live/mod.rs — webrtc modules MUST be declared before ort/fastembed.
# codegen-units was set to 1 as defense-in-depth but that forces LLVM to run
# single-threaded, pinning one core at 99% during compilation. The symbol conflict
# is a link-time issue unaffected by codegen units. Default 16 enables parallel LLVM.
[profile.release]
# codegen-units = 1  # REMOVED — was single-threading rustc compilation for no benefit
# Strip debug symbols — continuum-core-server is ~200MB+ without this, mostly
# from rustc-emitted DWARF for libstd + candle + llama.cpp FFI bindings. We
# don't ship debuggers into the container, and panics still produce readable
# traces via symbol names in the stripped binary (just not source-line info).
# Expected: ~200MB → ~80MB for continuum-core-server.
strip = "symbols"
# Thin LTO across crate boundaries. Gets ~80-90% of fat-LTO's runtime
# benefit (cross-crate inlining on the hot path — llama crate ↔ continuum-
# core per-token calls) but at a fraction of the build-time cost — ~5-10%
# vs ~30%. For a project where iteration speed matters as much as runtime
# perf, thin is the right default. Release-tagged builds can override
# upward to fat via `RUSTFLAGS="-C lto=fat"` on the single blessed build
# if we ever decide the last 10% is worth it.
lto = "thin"

# Hot-iter profile — fastest possible compile for inner-loop work
# (airc work claim → cargo build → test → repeat). Slice 3 of build-time
# doctrine card 424deb5e: a third lane between `dev` (ergonomic debug)
# and `release` (production perf). Used when we just need the binary to
# RUN — running stress baselines, exercising the persona loop, smoke
# tests — not when we're measuring perf or chasing a panic.
#
# Trade-offs vs `dev`:
# - opt-level = 0 matches dev (already the fastest opt level)
# - debug = "line-tables-only" keeps panic line numbers but skips full
#   DWARF (variable names, function args). 30-50% smaller object files,
#   meaningfully faster link.
# - codegen-units = 256 lets rustc parallelize across many small units.
#   Higher numbers cost runtime perf (less cross-unit inlining) but in
#   dev-fast we don't care — we're not measuring runtime.
# - incremental = true (already the dev default; explicit here for
#   discoverability — devs reading this profile shouldn't have to know
#   the cargo default).
#
# Invoke: `cargo build --profile dev-fast` or `cargo test --profile dev-fast`.
[profile.dev-fast]
inherits = "dev"
opt-level = 0
debug = "line-tables-only"
incremental = true
codegen-units = 256

# Override crates.io candle with our fork (Metal memory fix + RoPE NEOX fix).
#
# Status (2026-04-15): huggingface/candle PR #3411 — the RoPE NEOX fix
# from this fork — was ACCEPTED AND MERGED upstream. The Metal memory
# fix is also part of that fork branch. Once candle publishes a release
# on crates.io that contains #3411's merge commit, we can GRADUATE off
# the fork: drop the three `[patch.crates-io]` lines below and pin the
# released candle-* version directly in the workspace deps. Until then
# the fork stays — upstream-merged is necessary but not sufficient; only
# a published release lets `cargo` find the fix at a version number.
#
# To check: `cargo search candle-core` or the candle CHANGELOG for the
# first release >= the merge date. Graduation is a 3-line delete.
# This applies to all workspace members transparently.
[patch.crates-io]
candle-core = { git = "https://github.com/joelteply/candle.git", branch = "fix/metal-memory-and-rope-neox" }
candle-nn = { git = "https://github.com/joelteply/candle.git", branch = "fix/metal-memory-and-rope-neox" }
candle-transformers = { git = "https://github.com/joelteply/candle.git", branch = "fix/metal-memory-and-rope-neox" }

[workspace.package]
edition = "2021"
version = "0.1.0"
authors = ["JTAG Team"]
