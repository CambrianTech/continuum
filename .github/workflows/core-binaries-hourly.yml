# Cron and completed canary checks use the same publication admission owner.
# Activation and rollback: docs/operations/HOURLY-CORE-PUBLICATION.md.
name: core-binaries-hourly
on:
  workflow_run:
    workflows: ['Continuum Rust Tests']
    types: [completed]
    branches: [canary]
  schedule:
    - cron: '23 * * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Inspect admission without dispatching an expensive build'
        type: boolean
        default: true
  pull_request:
    paths:
      - '.github/workflows/core-binaries-hourly.yml'
      - 'tools/scripts/core-binaries-hourly.mjs'
      - 'tools/scripts/tests/core-binaries-hourly.test.mjs'
permissions:
  contents: read
concurrency:
  group: core-binaries-hourly-${{ github.event_name == 'pull_request' && github.ref || 'dispatch' }}
  cancel-in-progress: false
jobs:
  fixtures:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test tools/scripts/tests/core-binaries-hourly.test.mjs
  dispatch:
    needs: fixtures
    # Successful canary push checks wake the same enabled dispatcher as cron.
    # PR/fork runs, failed checks and manual upstream runs cannot publish.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (vars.CORE_BINARIES_HOURLY_ENABLED == 'true' &&
       (github.event_name == 'schedule' ||
        (github.event_name == 'workflow_run' &&
         github.event.workflow_run.conclusion == 'success' &&
         github.event.workflow_run.event == 'push' &&
         github.event.workflow_run.head_branch == 'canary' &&
         github.event.workflow_run.head_repository.full_name == github.repository)))
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: canary
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node tools/scripts/core-binaries-hourly.mjs
        env:
          GH_TOKEN: ${{ github.token }}
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run && 'true' || 'false' }}
