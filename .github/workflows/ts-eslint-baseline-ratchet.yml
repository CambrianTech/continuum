name: ts-eslint-baseline-ratchet

on:
  pull_request:
    branches: [canary, main]
    paths:
      - 'src/**/*.ts'
      - 'src/eslint.config.js'
      - 'src/eslint-baseline*.txt'
      - 'src/package.json'
      - 'src/package-lock.json'
      - 'src/tsconfig.eslint.json'
      - 'scripts/ratchets/check-eslint-baseline.sh'
      - '.github/workflows/ts-eslint-baseline-ratchet.yml'
  push:
    branches: [canary, main]
    # The push trigger carried NO paths filter while the pull_request trigger
    # above did — so it fired on EVERY push and died on `src/`, which moved to
    # `legacy/src/` (e46d968c5, task #83). Result: 100/100 failures, no green
    # since 2026-07-05, three red X's on every canary push that everyone
    # correctly learned to ignore. Same filter here means it fires only when
    # its target actually changes — the guard is intact and resumes the moment
    # those paths exist again. This deliberately does NOT decide whether the
    # legacy TS shell should be gated at all; #83 says location is the
    # CI-exclusion signal, and that call is Joel's.
    paths:
      - 'src/**/*.ts'
      - 'src/eslint.config.js'
      - 'src/eslint-baseline*.txt'
      - 'src/package.json'
      - 'src/package-lock.json'
      - 'src/tsconfig.eslint.json'
      - 'scripts/ratchets/check-eslint-baseline.sh'
      - '.github/workflows/ts-eslint-baseline-ratchet.yml'

jobs:
  ratchet:
    name: ts-eslint-baseline-ratchet
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: src/package-lock.json

      - name: Install dependencies
        working-directory: src
        run: npm ci

      - name: Run ESLint baseline ratchet
        run: bash scripts/ratchets/check-eslint-baseline.sh

      - name: Print ESLint details on failure
        if: failure()
        run: bash scripts/ratchets/check-eslint-baseline.sh --verbose || true
