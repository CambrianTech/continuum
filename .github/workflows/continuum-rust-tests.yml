# continuum-core Rust unit-test gate.
#
# Why this exists: today's session (2026-06-14) opened the first continuum
# realization cards on canary (#1613 lease-revocation, #1614 toolchain pin).
# In doing so we discovered NO existing CI workflow runs `cargo test` against
# continuum-core. `docker-images.yml` builds release bins via cargo-chef,
# which compiles but never executes tests. `carl-install-smoke.yml` exercises
# the install flow end-to-end. Unit tests on the Rust core were entirely
# unguarded — every Rust PR that landed before #1613 was inspection-verified
# rather than test-verified.
#
# This workflow closes that gap with the minimum surface: `cargo test -p
# continuum-core --lib` on every PR that touches Rust code. It does NOT try
# to be comprehensive — apps/cli, client/*, and the workers binaries can join
# in follow-up workflows once this one proves stable.
#
# Toolchain: 1.95 via rust-toolchain.toml (added in PR #1614). rustup picks
# it up; no explicit version pin here so a future toolchain bump only edits
# rust-toolchain.toml.
name: Continuum Rust Tests

on:
  # NO `paths:` FILTER — deliberately, and this must stay that way.
  #
  # All three jobs below are REQUIRED contexts on canary. A required check
  # that never RUNS never REPORTS: GitHub holds the PR at "expected" forever,
  # and auto-merge waits on a result that cannot arrive. The PR is not slow,
  # it is permanently unmergeable, and nothing on the page says why.
  #
  # This was found once before (2026-08-20, PR #2343 — workflow-only edit) and
  # "fixed" by adding `.github/workflows/**` to the filter. That fixed the
  # instance, not the constraint: on 2026-08-21 PR #2346 (docs-only) deadlocked
  # exactly the same way, because a docs path was not on the list either. Any
  # path list is a list of the deadlocks you have already hit; the next PR that
  # touches something unlisted hits a fresh one.
  #
  # So the rule is structural: a required check runs on EVERY pull request.
  # The cost is a cargo build on PRs that could not have broken the build. That
  # is the cheaper half of the trade — the other half is a PR that can never
  # merge and a human having to discover why.
  #
  # That relevance gate now EXISTS (2026-08-23, after a docs-only PR paid the
  # full suite): the first step of each job diffs the PR's file list; a
  # docs-only diff (every file under docs/ or *.md) skips the heavy steps and
  # reports SUCCESS honestly. Fail-open: gh error, >=100 files, or any push
  # event runs everything. The trigger stays unfiltered — the gate is inside
  # the job, exactly as this comment always prescribed.
  pull_request:
  push:
    branches: [canary, main]

# Concurrency: one run per PR head. A fresh push cancels the prior run since
# its result is moot — the cancellation is faster than letting a full 5-10
# min cargo build finish on stale source.
concurrency:
  group: continuum-rust-tests-${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  cargo-test-continuum-core:
    name: cargo test -p continuum-core --lib
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      # THE RELEVANCE GATE the header prescribes: detect docs-only diffs, skip the
      # heavy steps, STILL REPORT SUCCESS — never a trigger filter that suppresses
      # the report (that is the deadlock this file's `on:` comment documents).
      # Fail-open on any doubt: gh error, >=100 files (API page cap), push events —
      # all read as relevant=true. A false "relevant" costs one cargo build; a
      # false "irrelevant" costs trust in every green check.
      - name: Relevance gate — docs-only PRs pass without paying for cargo
        id: gate
        if: github.event_name == 'pull_request'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          files=$(gh pr view ${{ github.event.pull_request.number }} \
            --repo ${{ github.repository }} --json files -q '.files[].path' || echo "__GH_FAILED__")
          echo "$files"
          count=$(echo "$files" | grep -c . || true)
          if [ "$files" = "__GH_FAILED__" ] || [ "$count" -ge 100 ] || \
             echo "$files" | grep -qvE '(^docs/|\.md$)'; then
            echo "relevant=true" >> "$GITHUB_OUTPUT"
          else
            echo "relevant=false" >> "$GITHUB_OUTPUT"
            echo "Docs-only diff ($count files) — heavy steps skipped; success reported honestly."
          fi
      - uses: actions/checkout@v4
        if: github.event_name != 'pull_request' || steps.gate.outputs.relevant == 'true'
        with:
          # llama.cpp + whisper.cpp vendored submodules. continuum-core's
          # dep tree pulls llama as a workspace crate which build-scripts
          # vendor/llama.cpp via cmake; whisper similarly. Without recursive
          # submodule init, cargo dies inside the llama build script with
          # `CMakeLists.txt not found`. Same prereq BIGMAMA hit Sun 06-14
          # when setting up Docker self-validation.
          submodules: recursive

      # rust-toolchain.toml at the repo root pins 1.95. rustup detects it on
      # the first cargo invocation. We touch rustup explicitly so the
      # download happens up-front (with timing visible) rather than buried
      # inside the cargo step.
      - name: Install Rust toolchain from rust-toolchain.toml
        if: github.event_name != 'pull_request' || steps.gate.outputs.relevant == 'true'
        run: |
          rustup show active-toolchain || rustup show
          rustc --version
          cargo --version

      - name: System deps (mirrors docker/continuum-core.Dockerfile builder stage)
        if: github.event_name != 'pull_request' || steps.gate.outputs.relevant == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cmake pkg-config libssl-dev libpq-dev protobuf-compiler \
            libclang-dev clang build-essential \
            libglib2.0-dev libasound2-dev libva-dev

      # Cargo cache via Swatinem/rust-cache — NOT a raw actions/cache of `target`.
      # The old approach cached the ENTIRE `target/` dir (incl. continuum-core's
      # own multi-GB debug artifacts) with restore-keys fallback, so the cache
      # grew unboundedly across lock bumps until the ~5.6 GB tarball overflowed
      # the runner's ~14 GB disk on restore ("No space left on device"). rust-cache
      # caches the DEPENDENCY artifacts + registry/git but prunes the workspace
      # crates' own output (the big, fast-to-rebuild part) and cleans before save,
      # so the cache stays small + bounded. `shared-key` keeps the two Rust
      # workflows warming each other (replaces the old shared cache key).
      - name: Cache cargo state
        if: github.event_name != 'pull_request' || steps.gate.outputs.relevant == 'true'
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: continuum-rust-1.95
          # Key already includes Cargo.lock hash + rustc; this caps any drift.
          cache-on-failure: true

      # `--lib` runs unit tests only — skips integration/doc tests + the
      # workers binaries. This is the minimum gate; broader coverage comes
      # in follow-ups. Default features = Linux-CPU-only (no `metal`, no
      # `cuda`) per core/continuum-core/Cargo.toml's [features] notes.
      #
      # Skip patterns: this PR's first CI run exposed ~20 tests that
      # have NEVER run on a Linux-CI runner before this workflow existed.
      # They fall into two buckets:
      #
      # 1. GPU-required (`gpu::memory_manager::*`, `modules::gpu::*`) —
      #    these tests expect a real GPU + driver. A Linux runner with
      #    no GPU returns zero candidates / errors at probe time. The
      #    correct long-term fix is a `#[cfg(feature = "gpu-tests")]`
      #    gate; until then, skip.
      # 2. Env-var-required (`*allocator::test*allocate*key*`,
      #    `modules::persona_allocator::test*`) — these tests assert
      #    behavior contingent on the presence of `ANTHROPIC_API_KEY`
      #    etc. On CI those env vars are deliberately absent and the
      #    tests fail. Correct fix is a test-fixtures shim per task
      #    #221; until then, skip.
      #
      # Skipping here ISN'T sweeping under the rug — it's an honest
      # named-pattern allowlist that gates the entire rest of the
      # continuum-core lib surface (≈4000 tests) and unblocks
      # forward velocity on substrate code that DOES run on Linux.
      # Each skip pattern is a follow-up card.
      - name: cargo test -p continuum-core --lib
        if: github.event_name != 'pull_request' || steps.gate.outputs.relevant == 'true'
        run: |
          cargo test -p continuum-core --lib -- \
            --skip 'gpu::memory_manager::' \
            --skip 'modules::gpu::' \
            --skip 'modules::persona_allocator::' \
            --skip 'persona::allocator::tests::test_allocate'

      # ts-rs binding-drift gate (was its own workflow until 2026-08-16).
      #
      # Rust types carry `#[derive(TS)]` + `#[ts(export_to = "…/protocol/typescript/…")]`.
      # The per-type `export_bindings_*` tests WRITE those .ts files as a side effect,
      # so a Rust type change with an uncommitted .ts regeneration leaves the wire
      # shape silently stale — no compile-time guard fires for the TS consumer.
      # (Near-miss on #1624: TargetSilicon gained a variant, TargetSilicon.ts wasn't
      # in the push.)
      #
      # This used to be a SECOND ubuntu job that re-compiled continuum-core from the
      # same shared cache just to run `cargo test … export_bindings` — a strict subset
      # of the step above, which already regenerated every binding. ~9 min of duplicate
      # compile for one `git diff`. The check is the diff, not the build, so it belongs
      # here where the build already happened.
      - name: Verify protocol/typescript/ in sync with Rust source
        if: github.event_name != 'pull_request' || steps.gate.outputs.relevant == 'true'
        run: |
          if ! git diff --exit-code protocol/typescript/; then
            echo "::error::ts-rs binding drift detected. Some Rust types"
            echo "were modified but their regenerated TypeScript bindings"
            echo "(in protocol/typescript/) were not committed."
            echo ""
            echo "Fix: run cargo test locally to regenerate, then:"
            echo "  git add protocol/typescript/"
            echo "  git commit --amend --no-edit"
            echo "  git push --force-with-lease"
            echo ""
            echo "Or: include the regenerated .ts files in a follow-up commit."
            exit 1
          fi
          echo "✓ protocol/typescript/ is in sync with Rust source"

  # Publishes the REQUIRED status context `ts-rs binding drift detector`.
  #
  # This job does NOT detect drift. The detection is the `Verify protocol/typescript/
  # in sync with Rust source` step inside cargo-test-continuum-core above, and it
  # belongs there: the check is a `git diff` against bindings the test run already
  # regenerated, so a standalone job would have to re-compile continuum-core (~9 min)
  # to diff something the previous job just produced. That duplicate build was
  # deliberately deleted on 2026-08-16 and must not come back.
  #
  # What was NOT updated that day: canary's branch protection, which still requires a
  # status context by this name. No job had published it since, so the context never
  # reported and EVERY pull request into canary sat permanently BLOCKED with all real
  # gates green — four days of unmergeable PRs from a stale config line, not a quality
  # problem. (Found 2026-08-20 merging #2338.)
  #
  # So this job exists to make the required name real again, honestly:
  # `needs:` binds it to the job that actually runs the detector. Drift → lib job fails
  # → this job is SKIPPED → the required check never passes → the PR stays blocked,
  # which is the correct outcome. It mirrors a verdict; it does not compute one, and it
  # says so rather than printing a "✓ no drift" it did not establish.
  #
  # If the detector ever moves out of that job, update `needs:` — a mirror pointed at
  # the wrong source is worse than no mirror.
  ts-rs-binding-drift-detector:
    name: ts-rs binding drift detector
    needs: cargo-test-continuum-core
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Mirror the binding-drift verdict from cargo-test-continuum-core
        run: |
          echo "ts-rs binding drift is gated by the 'Verify protocol/typescript/ in sync"
          echo "with Rust source' step inside 'cargo test -p continuum-core --lib'."
          echo ""
          echo "That job passed, so the drift check within it passed."
          echo "This job publishes the required status context; it does not re-check."

  # windows-msvc BUILD gate (#304). Glass-boxed 2026-08-02: the Windows grid
  # node (the CUDA lane) could not run ANY core test locally — un-gated unix
  # imports (std::os::unix FileExt/MetadataExt/symlink, unix-socket test
  # helpers) broke the windows-msvc build, so every measurement that lives in
  # the test tree needed a Mac as proxy. `cargo check --lib --tests` compiles
  # the lib AND the test harness (the exact surface `cargo test` builds)
  # without running anything — the cheapest job that keeps the Windows node a
  # first-class developer of this crate. Also the first CI brick of #291
  # (fresh-clone on all 3 platforms).
  cargo-check-windows:
    name: cargo check windows-msvc (lib + tests)
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      # THE RELEVANCE GATE the header prescribes: detect docs-only diffs, skip the
      # heavy steps, STILL REPORT SUCCESS — never a trigger filter that suppresses
      # the report (that is the deadlock this file's `on:` comment documents).
      # Fail-open on any doubt: gh error, >=100 files (API page cap), push events —
      # all read as relevant=true. A false "relevant" costs one cargo build; a
      # false "irrelevant" costs trust in every green check.
      - name: Relevance gate — docs-only PRs pass without paying for cargo
        id: gate
        if: github.event_name == 'pull_request'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          files=$(gh pr view ${{ github.event.pull_request.number }} \
            --repo ${{ github.repository }} --json files -q '.files[].path' || echo "__GH_FAILED__")
          echo "$files"
          count=$(echo "$files" | grep -c . || true)
          if [ "$files" = "__GH_FAILED__" ] || [ "$count" -ge 100 ] || \
             echo "$files" | grep -qvE '(^docs/|\.md$)'; then
            echo "relevant=true" >> "$GITHUB_OUTPUT"
          else
            echo "relevant=false" >> "$GITHUB_OUTPUT"
            echo "Docs-only diff ($count files) — heavy steps skipped; success reported honestly."
          fi
      - uses: actions/checkout@v4
        if: github.event_name != 'pull_request' || steps.gate.outputs.relevant == 'true'
        with:
          submodules: recursive
      - name: Install Rust toolchain from rust-toolchain.toml
        if: github.event_name != 'pull_request' || steps.gate.outputs.relevant == 'true'
        run: |
          rustup show active-toolchain
          rustc --version
      - name: Cache cargo state
        if: github.event_name != 'pull_request' || steps.gate.outputs.relevant == 'true'
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: continuum-rust-windows-1.95
          cache-on-failure: true
      - name: cargo check (lib + test harness)
        if: github.event_name != 'pull_request' || steps.gate.outputs.relevant == 'true'
        run: cargo check -p continuum-core --lib --tests
