name: Validate Continuum Config

# The src/ Node+TS tree is the retiring shell; the Rust core under core/ is the
# source of truth (Capability/ModelInfo etc. are generated FROM Rust, so a Rust-side
# type change can drift the legacy Node consumers). This Node `build:ts` must therefore
# NOT gate Rust-core PRs to canary on a compile of code we are removing — that blocks
# validated substrate work on dead-shell drift. The Node compile is still enforced at
# the main-promotion boundary (here on PRs to main, and by ci.yml's build:ts), and can
# be run on demand. It is intentionally NOT a canary-PR gate.
on:
  workflow_dispatch:
  pull_request:
    branches: [ main ]
    paths:
      - 'src/**'

jobs:
  validate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src

    steps:
    - uses: actions/checkout@v4

    - name: Use Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
        cache-dependency-path: src/package-lock.json

    - name: Install dependencies
      run: npm ci

    - name: Validate JTAG System
      run: |
        npm run build:ts
        echo "✅ TypeScript compilation passed"
        echo "✅ Critical development systems validated"
        echo ""
        echo "Note: Full integration tests (browser + system deployment)"
        echo "are validated by the precommit hook locally before commits."