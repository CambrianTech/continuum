name: Dependency Check

# The web client's package.json lives at the repo root since the Node shell was retired
# (`src/` is gone). 2026-09-20 00:06Z: this schedule fired on the default branch with the
# old `src/package-lock.json` cache path, failed at setup-node ("Some specified paths were
# not resolved"), and its failed check-run landed on the canary TIP — which the deploy
# tracker read as a red tip and refused to deploy fleet-wide. A weekly audit must never
# be able to do that; the tracker now judges only the tip's own push checks, and this
# workflow points at the files that exist.
on:
  push:
    branches: [ main, canary ]
    paths:
      - 'package.json'
      - 'package-lock.json'
  pull_request:
    branches: [ main, canary ]
    paths:
      - 'package.json'
      - 'package-lock.json'
  schedule:
    - cron: '0 0 * * 0'  # Run weekly on Sunday at midnight

jobs:
  audit:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Use Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
        cache-dependency-path: package-lock.json

    - name: Install dependencies
      run: npm ci

    - name: Audit dependencies
      run: npm audit --omit=dev --audit-level=high

    - name: Check for outdated dependencies
      run: npm outdated || true