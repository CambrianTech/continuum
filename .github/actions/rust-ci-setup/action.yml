name: Rust CI setup
description: >
  Toolchain, system packages and the shared Rust build cache for every Linux Rust job of
  continuum-rust-tests. One owner for the setup the crate jobs, the CLI job and the
  cache-warming job share.
inputs:
  restore-target:
    description: >
      Restore the shared target cache and settle source mtimes against the commit it was built
      from. The cache-warming job passes 'false': it builds cold, so every cached unit is from
      one commit.
    default: 'true'
  save-apt:
    description: >
      Save the downloaded system packages. Only a push run's cache is visible to other runs (a
      pull request's is scoped to that pull request), and parallel jobs race for one key, so the
      warming job alone saves; every job restores.
    default: 'false'
outputs:
  cache-prefix:
    description: The target cache key prefix; a key is this prefix plus the commit it was built from.
    value: ${{ steps.key.outputs.prefix }}
runs:
  using: composite
  steps:
    # The 26.04 image has ONE disk: 87G free at setup and 62G after the cache unpacks (#5661's
    # notices on run 41233178745, c59624407, 2026-10-31), and one crate's test build filled the
    # rest; the worker then died writing its own log on / (canary 107e10ddc, #5673), and those
    # jobs keep no annotation at all. The image's preinstalled toolchains are ~25-30 GB that no
    # Rust job here reads (Android SDK, .NET, GHC, Boost, CodeQL): removed in the background, so
    # the deletion overlaps the cache restore instead of adding to the job's wall clock.
    - name: Free the runner's preinstalled toolchains
      shell: bash
      run: |
        df -h /
        sudo nohup rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghcup \
          /usr/local/share/boost /opt/hostedtoolcache/CodeQL > /dev/null 2>&1 &

    # The shared target is 24 GB unpacked (warm run 41193606500 at f0f786d19, 2026-10-31: 24G
    # after pruning 5.79 GB of test executables), restored beside its 5 GiB download, and a crate
    # job builds its tests on top. Two runner images are in rotation while ubuntu-latest moves to
    # 26.04 (from 2026-10-19). The 24.04 image's root disk ran out mid-setup and mid-build on
    # 10-31 (#5638, #5649 twice, #5641: "No space left on device"); it has a separate scratch disk
    # at /mnt. The 26.04 image has one disk: 145G, 87G free (measured on #5650's run). The build
    # goes on whichever disk has more room, at ONE path, so the cache restores and saves the same
    # way on both images.
    - name: Build where the runner has room
      shell: bash
      run: |
        sudo install -d -o "$(id -u)" -g "$(id -g)" /ci-target
        root_free=$(df --output=avail -B1 / | tail -1)
        if mountpoint -q /mnt && [ "$(df --output=avail -B1 /mnt | tail -1)" -gt "$root_free" ]; then
          sudo install -d -o "$(id -u)" -g "$(id -g)" /mnt/ci-target
          sudo mount --bind /mnt/ci-target /ci-target
        fi
        echo "CARGO_TARGET_DIR=/ci-target" >> "$GITHUB_ENV"
        df -h / /ci-target
        # The runner image and the room the build starts with. A job whose worker dies writing its
        # log on a full disk keeps NO annotation, this one included (run 41233178745's failed jobs,
        # 2026-10-31), so a disk-full is read from a sibling job's notices on the same image.
        target_dev=$(df --output=source /ci-target | tail -1)
        echo "::notice title=runner disk::${ImageOS:-unknown} ${ImageVersion:-unknown}; / free $(df -h --output=avail / | tail -1 | tr -d ' '); /ci-target on ${target_dev} free $(df -h --output=avail /ci-target | tail -1 | tr -d ' ')"

    - name: Install Rust toolchain from rust-toolchain.toml
      shell: bash
      run: |
        rustup show active-toolchain || rustup show
        rustc --version
        cargo --version

    - name: Cache keys
      id: key
      shell: bash
      run: |
        # The shared target cache is built cold at one canary commit by the warming job; its key
        # ends with that commit, which is what `settle` diffs against. A toolchain change starts
        # a new line. ImageOS/ImageVersion are runner machine variables (not in the env context).
        echo "prefix=continuum-rust-target-v3-${RUNNER_OS}-$(sha256sum rust-toolchain.toml | cut -c1-16)-" >> "$GITHUB_OUTPUT"
        apt="apt-debs-${ImageOS}-$(sha256sum "$GITHUB_ACTION_PATH/action.yml" | cut -c1-16)-"
        echo "apt-prefix=$apt" >> "$GITHUB_OUTPUT"
        echo "apt=$apt${ImageVersion}" >> "$GITHUB_OUTPUT"

    # The mirror, not apt, is the cost: in #5330's trials 3 of 13 jobs fetched the same 52.9 MB at
    # 65 kB/s (425-1,177 s; run 40056438743 hands: 13m37s). Cached debs come from the Actions
    # cache instead. The key is the runner image and this action, which holds the package list;
    # two image versions are in rotation, so any version's debs restore and apt downloads only a
    # package whose indexed version differs.
    - name: Restore system package downloads
      id: apt-cache
      uses: actions/cache/restore@v4
      with:
        path: ~/apt-archives
        key: ${{ steps.key.outputs.apt }}
        restore-keys: ${{ steps.key.outputs.apt-prefix }}

    # No prebuilt image carries these: ghcr holds only the runtime stages of
    # docker/continuum-core.Dockerfile, never its builder stage.
    - name: System deps (mirrors docker/continuum-core.Dockerfile builder stage)
      shell: bash
      run: |
        # A THIRD-PARTY REPO WE NEVER INSTALL FROM MUST NOT FAIL OUR BUILD.
        # The GitHub runner image ships vendor apt repos (Chrome, Microsoft, …).
        # `apt-get update` exits 100 if ANY index fails, so on 2026-09-09 a Hash Sum
        # mismatch on dl.google.com/linux/chrome-stable failed this step — and with it
        # every Rust run on every branch — for a package list nothing here reads.
        # Drop the vendor lists first, then update only the archives we install from,
        # with retries for genuinely transient mirror errors. A real failure to fetch
        # OUR packages still fails the step, loudly.
        sudo rm -f /etc/apt/sources.list.d/google-chrome.list \
                   /etc/apt/sources.list.d/microsoft-prod.list \
                   /etc/apt/sources.list.d/*azure-cli* 2>/dev/null || true
        # man-db re-indexes every installed manual page after dpkg; nothing here reads them.
        sudo rm -f /var/lib/man-db/auto-update
        mkdir -p ~/apt-archives/partial
        sudo apt-get update -o Acquire::Retries=3
        sudo apt-get install -y -o Acquire::Retries=3 -o Dir::Cache::Archives="$HOME/apt-archives" \
          --no-install-recommends \
          cmake pkg-config libssl-dev libpq-dev protobuf-compiler \
          libclang-dev clang build-essential \
          libglib2.0-dev libasound2-dev libva-dev
        sudo chown -R "$(id -u):$(id -g)" ~/apt-archives

    - name: Save system package downloads
      if: inputs.save-apt == 'true' && steps.apt-cache.outputs.cache-hit != 'true'
      uses: actions/cache/save@v4
      with:
        path: ~/apt-archives
        key: ${{ steps.apt-cache.outputs.cache-primary-key }}

    - name: Restore the shared target cache
      id: target-cache
      if: inputs.restore-target == 'true'
      uses: actions/cache/restore@v4
      with:
        path: |
          /ci-target
          ~/.cargo/registry/index
          ~/.cargo/registry/cache
          ~/.cargo/git/db
        key: ${{ steps.key.outputs.prefix }}${{ github.sha }}
        restore-keys: ${{ steps.key.outputs.prefix }}

    - name: Settle source mtimes against the cache commit
      if: inputs.restore-target == 'true'
      shell: bash
      env:
        MATCHED_KEY: ${{ steps.target-cache.outputs.cache-matched-key }}
        PREFIX: ${{ steps.key.outputs.prefix }}
      run: |
        # Unpack every dependency source first, so its mtimes are settled with the workspace's.
        cargo fetch --target x86_64-unknown-linux-gnu
        node tools/scripts/ci-cargo-freshness.cjs settle --prefix "$PREFIX" --matched-key "$MATCHED_KEY"
        # Beside the setup notice: the room left after the cache unpacked. The drop between the two
        # free figures is the cache's size, with no walk of the tree (Fable on #5661).
        echo "::notice title=runner disk after cache::/ci-target free $(df -h --output=avail /ci-target | tail -1 | tr -d ' ')"
