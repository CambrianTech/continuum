[package]
name = "continuum-capture"
version = "0.1.0"
edition = "2021"
publish = false
# Captures stamp the build they ran on (CONTINUUM_BUILD_GIT_SHA): core's build script is the one owner.
build = "../continuum-core/build.rs"
description = "The capture of a mind's turns: the capture fixture-directory policy and the prompt-capture recorder, owner and playback store. A leaf of the cognition crate tree (docs/architecture/COGNITION-CRATE-TREE.md)."

[dependencies]
continuum-base = { workspace = true }
continuum-kernel = { workspace = true }
continuum-engine = { workspace = true }
continuum-rooms = { workspace = true }
continuum-sage = { workspace = true }  # the capture writer is a SAGE component on the node bus
parking_lot.workspace = true
tokio.workspace = true
serde.workspace = true
serde_json.workspace = true
rmp-serde.workspace = true
thiserror.workspace = true
tracing.workspace = true
ts-rs.workspace = true
uuid.workspace = true
airc-core.workspace = true  # ThreadRef names a served request's room events by airc's own typed ids

[features]
test-fixtures = ["continuum-kernel/test-fixtures"]

[dev-dependencies]
continuum-kernel = { workspace = true, features = ["test-fixtures"] }
tempfile = { workspace = true }
