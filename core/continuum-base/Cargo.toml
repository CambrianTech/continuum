[package]
name = "continuum-base"
version = "0.1.0"
edition = "2021"
description = "The floor of the core: leaf utilities every other crate may depend on and that depend on nothing in Continuum (time, config, secrets, ids, portable shell, audio constants)."

[dependencies]
chrono.workspace = true
serde = { workspace = true }
sha2.workspace = true # tool_evidence: a check is bound to the exact bytes it read
dirs = { workspace = true }
tracing.workspace = true
uuid.workspace = true
async-trait.workspace = true # Lifecycle::act is called through dyn parts
event-listener.workspace = true # Completion wakes every observer on each answer
futures.workspace = true # the executor seam (task::Spawn) parts run their verbs on
parking_lot.workspace = true

[dev-dependencies]
serde_json = { workspace = true } # non_empty_list: the empty list is refused at the parse
tempfile = { workspace = true }
futures = { workspace = true, features = ["thread-pool"] } # parts tests run verbs on a real pool
