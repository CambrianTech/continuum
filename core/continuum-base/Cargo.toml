[package]
name = "continuum-base"
version = "0.1.0"
edition = "2021"
description = "The floor of the core: leaf utilities every other crate may depend on and that depend on nothing in Continuum (time, config, secrets, ids, portable shell, audio constants)."

[dependencies]
chrono.workspace = true
serde = { workspace = true }
dirs = "5.0"
tracing.workspace = true
uuid.workspace = true

[dev-dependencies]
tempfile = "3"
