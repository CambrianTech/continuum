[package]
name = "continuum-prompt"
version = "0.1.0"
edition = "2021"
publish = false
description = "Prompt assembly and its budgets: prompt assembly, context and token budgets, prefix reuse, audience, framing-echo and not-speech checks, response validation. A leaf of the cognition crate tree (docs/architecture/COGNITION-CRATE-TREE.md)."

[dependencies]
tracing.workspace = true  # continuum_base::probe! expands to tracing::event
continuum-base = { path = "../continuum-base" }
continuum-kernel = { path = "../continuum-kernel" }
continuum-engine = { path = "../continuum-engine" }
continuum-text-analysis = { path = "../continuum-text-analysis" }
dashmap = { workspace = true }
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
uuid.workspace = true
