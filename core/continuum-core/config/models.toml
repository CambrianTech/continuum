# ─── In-process llama.cpp (Metal/CUDA direct) ───────────────────────────

# Qwen2.5-0.5B-Instruct GGUF — the substrate's LCD (lowest-common-
# denominator) model per Joel (2026-06-01) and
# [[lcd-model-qwen25-05b-and-foundry-lora]]. Plain-attention Qwen2
# architecture (no SSM ops), 468 MiB on disk at Q4_K_M, runs on Compat
# tier hardware including this Intel MacBookPro15,1 + Radeon Pro 560X
# via CPU-only path while [[#131]] tracks the upstream Metal hang fix.
# Multi-persona at this tier means two of these in parallel; future
# shared-base + LoRA paging (#122) makes that cheap.
#
# Sibling BF16 safetensors at
# `~/.continuum/genome/models/qwen2.5-0.5b-instruct/safetensors/`
# are the candle-trainable form for foundry LoRA work
# ([[experiential-plasticity-mitosis-cull-sentinel]]).
[[model]]
id = "continuum-ai/qwen2.5-0.5b-instruct-GGUF"
name = "Qwen2.5 0.5B Instruct (LCD)"
provider = "llamacpp-local"
arch = "qwen2"
context_window = 32768
max_output_tokens = 4096
tokens_per_second = 60.0
capabilities = ["text-generation", "chat", "streaming"]
cost_input_per_1k = 0.0
cost_output_per_1k = 0.0
gguf_hint = "huggingface.co/Qwen/Qwen2.5-0.5B-Instruct-GGUF"
gguf_local_path = "~/.continuum/genome/models/qwen2.5-0.5b-instruct/qwen2.5-0.5b-instruct-q4_k_m.gguf"
# Qwen2.5 chatml template. Qwen2.5-Instruct ships with the same chatml
# format Qwen3.5 uses; reusing the same template string.
chat_template = "{% for message in messages %}{{ '<|im_start|>' + message['role'] + '\\n' + message['content'] + '<|im_end|>\\n' }}{% endfor %}{% if add_generation_prompt %}{{ '<|im_start|>assistant\\n' }}{% endif %}"
# Qwen2.5's tokenizer correctly emits <|im_end|> at chat-turn end as
# the eos token (id 151645). Listing as a stop sequence anyway for
# defense-in-depth: scheduler matches against streamed text and stops
# even if the EOG flag misses for any reason. <|endoftext|> covers the
# pretrain-style termination path.
stop_sequences = ["<|im_end|>", "<|endoftext|>"]
# Qwen2.5 was trained on standard ChatML user/assistant alternation,
# same multi-party limitation as qwen3.5 — model cannot coherently
# process multiple AI speakers in one transcript. proper_chat_ml_single
# _party drops other-persona turns and presents the model only with
# user/assistant alternation it was trained on.
multi_party_strategy = "proper_chat_ml_single_party"

# ─── Local in-process: Qwen3-Embedding-0.6B (the grid's canonical retrieval
# embedder) ───
#
# The recall hippocampus (RecallFaculty) ranks memories by semantic relevance,
# which needs a NEURAL embedder — not the lexical word-overlap bootstrap. This
# row is that embedder, served IN-PROCESS by LlamaCppAdapter (GPU forward via
# llama.cpp Metal/CUDA, no HTTP hop).
#
# DELIBERATELY DECOUPLED FROM THE CHAT MODEL. Asha's brain (chat) can be any
# model — a local 4B, a remote 70B, a cloud model over the gateway — and recall
# embeddings stay pinned to THIS model. One stable embedding space grid-wide
# ([[embeddings-are-per-content-computed-once-shared]]) means stored vectors and
# query vectors are always comparable; changing the chat model never invalidates
# the engram vectors. `resolve_recall_embedder` finds this row by
# (provider=llamacpp-local ∧ capability=embedding ∧ gguf on disk) and prefers it
# over routing embeddings through the chat gateway (which may not serve
# /v1/embeddings at all). The embedding-SPACE identity (cache key) is the
# canonical slug `qwen3-embedding-0.6b`, overridable with UNSLOTH_EMBED_MODEL for
# a grid that standardizes on a different embed model.
[[model]]
id = "continuum-ai/qwen3-embedding-0.6b-GGUF"
name = "Qwen3-Embedding-0.6B (in-process retrieval embedder)"
provider = "llamacpp-local"
arch = "qwen3"
# Qwen3-Embedding supports a 32k context; recall queries + engram bodies are far
# shorter, but the model's stated window is 32768.
context_window = 32768
# Embedding model — it produces vectors, never generated tokens.
max_output_tokens = 0
tokens_per_second = 0.0
capabilities = ["embedding"]
cost_input_per_1k = 0.0
cost_output_per_1k = 0.0
gguf_hint = "huggingface.co/Qwen/Qwen3-Embedding-0.6B-GGUF"
gguf_local_path = "~/.continuum/genome/models/qwen3-embedding-0.6b/Qwen3-Embedding-0.6B-Q8_0.gguf"

[[model]]
id = "continuum-ai/qwen3.5-4b-code-forged-GGUF"
name = "Qwen3.5 4B Code-Forged (in-process)"
provider = "llamacpp-local"
arch = "qwen35"
context_window = 262144
max_output_tokens = 32768
tokens_per_second = 33.0
capabilities = ["text-generation", "chat", "tool-use", "streaming"]
cost_input_per_1k = 0.0
cost_output_per_1k = 0.0
gguf_hint = "huggingface.co/continuum-ai/qwen3.5-4b-code-forged-gguf"
# Explicit local path — the auto-resolver in
# `model_registry::artifacts::find_model_dir_in_root` compares
# `repo_name.to_lowercase().replace('.','')` against the on-disk
# directory name. For this row that yields `qwen35-4b-code-forged-gguf`
# vs the actual dir `qwen3.5-4b-code-forged` — no match because the
# dot stays in the dir name and the dir lacks the `-gguf` suffix.
# Explicit path bypasses the heuristic and is the source-of-truth for
# the local file. Lands at boot via `model_registry::artifacts::
# resolve_gguf`'s explicit branch (first priority). Followup: fix the
# dir-name heuristic OR rename the dir to match the model_id slug —
# tracked as a separate doctrinal cleanup. For now this is the path
# that gets a real LLM running per [[no-fallbacks-ever]] (the resolver
# correctly returns None today; we're not adding a fallback, we're
# wiring the explicit field that was always supported).
gguf_local_path = "~/.continuum/genome/models/qwen3.5-4b-code-forged/qwen3.5-4b-code-forged-Q4_K_M.gguf"
# Explicit qwen3.5 chatml template. The forged GGUF doesn't embed
# `tokenizer.chat_template` in its metadata, and llama.cpp's built-in
# chatml default drifts from qwen3.5's training on boundary tokens
# (verified 2026-04-20: fragments like `the </|>` bled into chat when
# the built-in was used). The proper architectural fix is to embed this
# template in the GGUF at forge time — filed as a forge-recipe follow-up.
# Until then, this TOML row is the source of truth and the llamacpp
# adapter reads it through the registry.
chat_template = "{% for message in messages %}{{ '<|im_start|>' + message['role'] + '\\n' + message['content'] + '<|im_end|>\\n' }}{% endfor %}{% if add_generation_prompt %}{{ '<|im_start|>assistant\\n' }}{% endif %}"
# Stop sequences (text-form). The forged GGUF's tokenizer.ggml.eos_token_id
# = 248046 is wrong — qwen3.5's chat-end is the `<|im_end|>` token (151645).
# Until the forge recipe re-bakes with the correct EOS id, the scheduler
# matches these strings against the streamed output and stops the seq.
# Same architectural rule: per-model knobs are TOML, not adapter code.
stop_sequences = ["<|im_end|>", "<|endoftext|>"]
# Multi-party chat shape. qwen3.5 was trained on alternating user/assistant
# turns and cannot coherently process multi-party (multiple AI speakers in
# the same room). The earlier `single_user_turn_flattened_history` strategy
# tried to work around this by flattening history into one user turn with
# `<Name>:` prefixes + a closing instruction "no name prefix, no quoting" —
# qwen3.5 ignored the instruction and emitted name-prefixed completions
# anyway, producing the visible echo-loop + sentinel-leak symptoms in the
# 2026-04-24 empirical chat (task #75, PR-blocker).
#
# `proper_chat_ml_single_party` is the source-level fix Joel asked for
# instead of TS-side regex stripping: own-persona prior turns become
# role:assistant, human messages become role:user, OTHER-persona turns are
# DROPPED — the model only ever sees a clean user/assistant alternation it
# was actually trained on. No closing-cue, no prefixes, no transcript-as-
# completion-pattern setup. Honest cost: personas on this model are blind
# to other AI peers in the room. That's the model's actual capability
# boundary, not a workaround. See MultiPartyChatStrategy enum doc.
multi_party_strategy = "proper_chat_ml_single_party"

# ─── Vision-capable Qwen2-VL-7B (in-process llama.cpp + mtmd) ───────────
# Reference vision model for the local multimodal path. mmproj_local_path
# is the multimodal projector — required for `Capability::Vision` on the
# local path because libmtmd needs it to encode image bytes into tokens
# compatible with this model's embedding space. Cloud providers handle
# their own projection server-side; local needs the explicit file.
#
# `tests/llamacpp_vision_integration.rs` validates the full Rust pipeline
# against this entry — a real cat photo goes in, natural-language
# description comes out (verified 2026-04-21 with the libmtmd backend
# dedup fix in commit f098c4331). When `tests/vision_integration.rs`
# targets this model_id, the chat path → adapter → backend.generate_with_image
# → mtmd → projector → text-decoder route is exercised top to bottom.
[[model]]
id = "qwen2-vl-7b-instruct"
name = "Qwen2-VL-7B-Instruct (in-process)"
provider = "llamacpp-local"
arch = "qwen2"
context_window = 32768
max_output_tokens = 4096
tokens_per_second = 16.0
capabilities = ["text-generation", "chat", "vision", "streaming"]
cost_input_per_1k = 0.0
cost_output_per_1k = 0.0
# Same multi-party strategy as the qwen3.5 entries: drop other-persona turns from
# history and assemble proper ChatML so Vision AI doesn't echo "Local Assistant:"
# / "Teacher AI:" name prefixes on vision replies (Joel 2026-04-24 brick test).
multi_party_strategy = "proper_chat_ml_single_party"
gguf_hint = "huggingface.co/bartowski/Qwen2-VL-7B-Instruct-GGUF"
# Local path on the dev machine. Production install (Carl/Dev) pulls
# these via `install.sh` into a per-user model cache. Auto-discovery of
# the mmproj from `gguf_hint` + a sibling-file naming convention is a
# follow-up so this path doesn't need to be hand-edited per machine.
gguf_local_path = "~/models/qwen2-vl-7b/Qwen2-VL-7B-Instruct-Q4_K_M.gguf"
mmproj_local_path = "~/models/qwen2-vl-7b/mmproj-Qwen2-VL-7B-Instruct-f16.gguf"

