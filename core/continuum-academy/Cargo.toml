[package]
name = "continuum-academy"
version = "0.1.0"
edition = "2021"
publish = false
repository = "https://github.com/CambrianTech/continuum"
# Cognition stamps her captures, continuity and handoffs with the build they ran on
# (CONTINUUM_BUILD_GIT_SHA): core's build script is the one owner of that identity.
build = "../continuum-core/build.rs"

# The academy: all learning capacity (plan line 1): cut out of continuum-cognition and
# placed above it; cognition names none of it. The mind re-exports this crate's `cognition`.

[dependencies]
continuum-process = { path = "../continuum-process" }
continuum-cognition = { path = "../continuum-cognition" }
continuum-kernel = { path = "../continuum-kernel" }
continuum-engine = { path = "../continuum-engine" }
continuum-hands = { path = "../continuum-hands" }
continuum-live = { path = "../continuum-live" }
continuum-memory = { path = "../continuum-memory" }
continuum-perception = { path = "../continuum-perception" }
continuum-genome = { path = "../continuum-genome" }
continuum-experience = { path = "../continuum-experience" }
tokio.workspace = true
serde.workspace = true
serde_json.workspace = true
uuid.workspace = true
continuum-base = { path = "../continuum-base" }
continuum-context = { path = "../continuum-context" }
tool-working-set = { path = "../tool-working-set" }  # the learned tool head: pure policy, no core dependency
schemars = { workspace = true }
continuum-airc-protocol = { path = "../continuum-airc-protocol" }
continuum-positron = { path = "../continuum-positron" }
continuum-client = { path = "../../client/continuum-client" }
reqwest = { workspace = true, features = ["json", "multipart", "stream"] }
thiserror.workspace = true
dashmap = { workspace = true }  # Lock-free concurrent HashMap
inventory = { workspace = true }
fs2 = { workspace = true }      # Cross-platform advisory file locks (flock / LockFileEx)
toml = { workspace = true }
continuum-cli-lifecycle = { path = "../continuum-cli-lifecycle" }  # the CLI's platform lifecycle; its tests must not link this crate
base64 = { workspace = true }
sha2 = { workspace = true }   # SHA-256 for OAuth 2.0 PKCE code challenges (RFC 7636) + L1-6 contract canonical hash
airc-core.workspace = true
airc-blobs.workspace = true
airc-protocol.workspace = true
airc-lib.workspace = true
airc-work.workspace = true
async-trait.workspace = true
chrono.workspace = true
parking_lot.workspace = true
tokio-stream.workspace = true
futures-util.workspace = true
futures = { workspace = true }
once_cell.workspace = true
num_cpus = { workspace = true }  # CPU count detection
dirs = { workspace = true }
sysinfo = { workspace = true }  # Cross-platform CPU, memory, system resource monitoring
tracing.workspace = true
ts-rs.workspace = true  # TypeScript type generation
arc-swap = { workspace = true }           # Wait-free policy publish for SubstrateGovernor (Lane H)
image = { workspace = true }
regex = { workspace = true }

[dev-dependencies]
continuum-cognition = { path = "../continuum-cognition", features = ["test-fixtures"] }
continuum-kernel = { path = "../continuum-kernel", features = ["test-fixtures"] }  # every test build of this crate gets the per-process continuum home (card d11d9827)
tokio = { workspace = true, features = ["test-util"] }
tempfile = { workspace = true }
continuum-client = { path = "../../client/continuum-client", features = ["test-fixtures"] }
continuum-positron = { path = "../continuum-positron", features = ["test-fixtures"] }
continuum-genome = { path = "../continuum-genome", features = ["test-fixtures"] }
continuum-experience = { path = "../continuum-experience", features = ["test-fixtures"] }

[features]
default = []
# The GPU backends are the engine's (llama, candle); cognition forwards them so it builds and
# tests on its own with the same flags core takes.
metal = ["continuum-cognition/metal", "continuum-engine/metal", "continuum-live/metal", "continuum-genome/metal"]
cuda = ["continuum-cognition/cuda", "continuum-kernel/cuda", "continuum-engine/cuda", "continuum-genome/cuda"]
vulkan = ["continuum-cognition/vulkan", "continuum-kernel/vulkan", "continuum-engine/vulkan", "continuum-genome/vulkan"]
stress-tests = ["continuum-cognition/stress-tests", "continuum-kernel/stress-tests"]
# Test-only code (fixtures shared with core's integration tests, the heuristic adapter it
# drives); production binaries never build with it.
test-fixtures = ["continuum-cognition/test-fixtures", "continuum-kernel/test-fixtures", "continuum-engine/test-fixtures", "continuum-hands/test-fixtures", "continuum-live/test-fixtures", "continuum-perception/test-fixtures", "continuum-genome/test-fixtures", "continuum-experience/test-fixtures"]
