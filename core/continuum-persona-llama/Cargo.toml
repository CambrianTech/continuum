[package]
name = "continuum-persona-llama"
version = "0.1.0"
edition = "2021"
description = "The persona engine's residency tier over the fork's native persona blocks (CONTINUUM-ENGINE 4.14): one context, two execution streams (the active mind decodes in one while the next binds into the other), every other mind's blocks in RAM. A switch is a native bind, never a serialize or a re-prefill."

[features]
metal = ["llama/metal"]
# The raw-context accessor custody replays need to put foreign state on a stream. Never on the
# production path.
test-fixtures = []

[[example]]
name = "persona_switch"
required-features = ["test-fixtures"]

[dependencies]
continuum-base = { workspace = true } # probe!: a refused decode reports what the engine held
continuum-persona-engine = { workspace = true }
llama = { workspace = true }
tracing.workspace = true # probe! expands to tracing
thiserror.workspace = true
uuid.workspace = true

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
