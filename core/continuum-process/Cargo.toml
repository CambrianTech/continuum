[package]
name = "continuum-process"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
continuum-base = { path = "../continuum-base" }
tracing.workspace = true
continuum-kernel = { path = "../continuum-kernel" }
tokio.workspace = true
airc-core.workspace = true
sysinfo = { workspace = true }
libc = { workspace = true }

[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true, features = ["Win32_System_Threading", "Win32_System_Console"] }

[dev-dependencies]
continuum-kernel = { path = "../continuum-kernel", features = ["test-fixtures"] }
tempfile = { workspace = true }


