[package]
name = "continuum-process"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
continuum-host = { workspace = true } # process_name and process_end: a pid's name and its kill, which differ by OS
continuum-base = { workspace = true }
tracing.workspace = true
continuum-kernel = { workspace = true }
tokio.workspace = true
airc-core.workspace = true
sysinfo = { workspace = true }

[target.'cfg(windows)'.dev-dependencies]
windows-sys = { workspace = true, features = ["Win32_System_Console"] } # tests.rs: a child spawned with no console window

[dev-dependencies]
continuum-kernel = { workspace = true, features = ["test-fixtures"] }
tempfile = { workspace = true }


