[package]
name = "continuum-process"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
continuum-host = { workspace = true } # process_name: a pid's command name read from the kernel
continuum-base = { workspace = true }
tracing.workspace = true
continuum-kernel = { workspace = true }
tokio.workspace = true
airc-core.workspace = true
sysinfo = { workspace = true }
libc = { workspace = true }

[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true, features = ["Win32_System_Threading", "Win32_System_Console"] }

[dev-dependencies]
continuum-kernel = { workspace = true, features = ["test-fixtures"] }
tempfile = { workspace = true }


