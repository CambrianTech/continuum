[package]
name = "continuum-engine"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
continuum-persona-engine = { workspace = true }
continuum-persona-llama = { workspace = true }
continuum-sage = { workspace = true }
continuum-process = { workspace = true }
continuum-blocks = { workspace = true } # the persona scheduler joins its minds' live KV home as an instance under a lease
bytemuck = { workspace = true } # a mind's token history is written and read as its own bytes, never encoded per token
tempfile = { workspace = true, optional = true }
continuum-kernel = { workspace = true }
continuum-tool-protocol = { workspace = true }
continuum-context = { workspace = true } # a lesson too long to learn is collapsed through the one context codec, never truncated
tokio.workspace = true
expert-pager-policy = { workspace = true }
serde.workspace = true
serde_json.workspace = true
uuid.workspace = true
continuum-base = { workspace = true }
continuum-service = { workspace = true }  # the resident alarm a node beacons (card 1c157668)
continuum-host = { workspace = true }
continuum-saved-state = { workspace = true } # the measured rate stores save and load through the one contract
schemars = { workspace = true }
continuum-airc-protocol = { workspace = true }
reqwest = { workspace = true, features = ["json", "multipart", "stream"] }
thiserror.workspace = true
dashmap = { workspace = true }  # Lock-free concurrent HashMap
inventory = { workspace = true }
libc = { workspace = true }     # Process group management (setsid, kill -pgid)
fs2 = { workspace = true }      # Cross-platform advisory file locks (flock / LockFileEx)
continuum-cli-lifecycle = { workspace = true }  # the CLI's platform lifecycle; its tests must not link this crate
base64 = { workspace = true }  # Base64 encoding for audio data
sha2 = { workspace = true }   # SHA-256 for OAuth 2.0 PKCE code challenges (RFC 7636) + L1-6 contract canonical hash
airc-core.workspace = true
airc-protocol.workspace = true
airc-lib.workspace = true
async-trait.workspace = true
axum = { workspace = true }
parking_lot.workspace = true
futures = { workspace = true }  # For VAD block_on in audio thread
ort.workspace = true  # ONNX Runtime for TTS
num_cpus = { workspace = true }  # CPU count detection
dirs = { workspace = true }  # User directories for model paths
sysinfo = { workspace = true }  # Cross-platform CPU, memory, system resource monitoring
llama = { workspace = true }
candle-core.workspace = true
candle-nn.workspace = true  # For VarBuilder
candle-transformers.workspace = true
safetensors.workspace = true  # Model weight files
half = { workspace = true }                  # f16/bf16 handling for LoRA
tracing.workspace = true
ts-rs.workspace = true  # TypeScript type generation
rayon.workspace = true  # ai::embedding's matrix and top-k kernels run across cores
wide = { workspace = true }  # Portable SIMD (f32x8) for embedding similarity math — NEON on
              # aarch64 (Mac) / AVX on x86 (Linux grid), guaranteed vectorization
              # at any opt-level (not auto-vec, which only fires in release).

[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true, features = ["Win32_Globalization", "Win32_Security", "Win32_Security_AppLocker", "Win32_Storage_FileSystem", "Win32_System_Console", "Win32_System_Environment", "Win32_System_JobObjects", "Win32_System_Pipes", "Win32_System_ProcessStatus", "Win32_System_SystemInformation", "Win32_System_SystemServices", "Win32_System_Threading"] }

[target.'cfg(target_os = "macos")'.dependencies]
metal = { workspace = true }

[dev-dependencies]
continuum-kernel = { workspace = true, features = ["test-fixtures"] }  # every test build of this crate gets the per-process continuum home (card d11d9827)
tokio = { workspace = true, features = ["test-util"] }
tempfile = { workspace = true }                   # Temp directories for code module tests
continuum-saved-state = { workspace = true, features = ["test-fixtures"] } # every kind runs the one round trip
airc-protocol = { workspace = true }
futures = { workspace = true }


# The llama crate's backend follows the machine, so a plain `cargo check` / `cargo test` builds the
# right engine: Metal on Apple Silicon; the CPU profile on an Intel Mac, where ggml-metal device init
# hangs (#129). No `--features metal` to remember, and no CPU-only build on an M-series by accident.
[target.'cfg(all(target_os = "macos", target_arch = "aarch64"))'.dependencies]
llama = { workspace = true, features = ["metal"] }

[target.'cfg(all(target_os = "macos", target_arch = "x86_64"))'.dependencies]
llama = { workspace = true, features = ["mac-cpu-only"] }

[features]
default = []
coreml = []
cuda = ["candle-core/cuda", "candle-nn/cuda", "candle-transformers/cuda", "llama/cuda", "ort/cuda", "continuum-kernel/cuda"]
directml = ["ort/directml"]
metal = ["candle-core/metal", "candle-nn/metal", "candle-transformers/metal", "llama/metal", "ort/coreml"]
openvino = ["ort/openvino"]
rocm = ["ort/rocm"]
test-fixtures = ["continuum-kernel/test-fixtures", "dep:tempfile"]
vulkan = ["llama/vulkan", "continuum-kernel/vulkan"]
