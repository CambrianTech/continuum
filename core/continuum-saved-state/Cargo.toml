[package]
name = "continuum-saved-state"
version = "0.1.0"
edition = "2021"
publish = false
description = "The one contract for state that outlives a process: an owner declares its kind, format, typed key, validity contract, medium and retention; every load returns a typed Loaded verdict with one probe per outcome, every save is one atomic envelope. Sits on continuum-base and continuum-host only, so every crate may use it."

[dependencies]
continuum-base = { path = "../continuum-base" } # probe!, EpochMs
continuum-host = { path = "../continuum-host" } # durable::write_replace: the one atomic placement
serde = { workspace = true }
tracing = { workspace = true } # the probe! macro expands to tracing events
serde_json = { workspace = true }
uuid = { workspace = true } # a persona-keyed kind's typed key
sha2 = { workspace = true } # the save receipt names the bytes it placed

[features]
# The generic round trip every kind runs in its own tests (`round_trip::every_outcome`).
test-fixtures = []

[dev-dependencies]
tempfile = { workspace = true }
