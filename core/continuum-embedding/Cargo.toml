[package]
name = "continuum-embedding"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
continuum-kernel = { path = "../continuum-kernel" }
continuum-engine = { path = "../continuum-engine" }
tokio.workspace = true
serde.workspace = true
serde_json.workspace = true
schemars = { version = "0.8", features = ["uuid1"] }
async-trait.workspace = true
inventory = "0.3"
ts-rs.workspace = true

[dev-dependencies]
continuum-kernel = { path = "../continuum-kernel", features = ["test-fixtures"] }
continuum-engine = { path = "../continuum-engine", features = ["test-fixtures"] }
continuum-memory = { path = "../continuum-memory" }  # DeterministicEmbeddingProvider for the command tests
