[package]
name = "continuum-mind"
version = "0.1.0"
edition = "2021"
publish = false
repository = "https://github.com/CambrianTech/continuum"
# The mind stamps her captures, continuity and rest seats with the build they ran on
# (CONTINUUM_BUILD_GIT_SHA): core's build script is the one owner of that identity, so the
# mind runs the same script rather than a copy of it.
build = "../continuum-core/build.rs"

[dependencies]
continuum-process = { workspace = true }
continuum-academy = { workspace = true }
continuum-kernel = { workspace = true }
continuum-sage = { workspace = true } # her senses are a worker on the dataflow substrate
continuum-engine = { workspace = true }
continuum-hands = { workspace = true }
continuum-embedding = { workspace = true }  # work/similar and work/duplicates rank card text with its vector math
continuum-live = { workspace = true }
continuum-memory = { workspace = true }
continuum-perception = { workspace = true }
continuum-genome = { workspace = true }
continuum-experience = { workspace = true }
tokio.workspace = true
serde.workspace = true
serde_json.workspace = true
uuid.workspace = true
continuum-base = { workspace = true }
continuum-host = { workspace = true }
continuum-context = { workspace = true }
schemars = { workspace = true }
continuum-airc-protocol = { workspace = true }
continuum-positron = { workspace = true }
continuum-text-analysis = { workspace = true }
continuum-client = { workspace = true }
reqwest = { workspace = true, features = ["json", "multipart", "stream"] }
thiserror.workspace = true
dashmap = { workspace = true }  # Lock-free concurrent HashMap
inventory = { workspace = true }
fs2 = { workspace = true }      # Cross-platform advisory file locks (flock / LockFileEx)
toml = { workspace = true }
continuum-cli-lifecycle = { workspace = true }  # the CLI's platform lifecycle; its tests must not link this crate
base64 = { workspace = true }
sha2 = { workspace = true }   # SHA-256 for OAuth 2.0 PKCE code challenges (RFC 7636) + L1-6 contract canonical hash
continuum-cognition = { workspace = true }
continuum-grounding = { workspace = true }  # her thread of a room, the value a turn pins and hands its sources
airc-core.workspace = true
airc-blobs.workspace = true
airc-protocol.workspace = true
airc-lib.workspace = true
airc-ipc.workspace = true
airc-work.workspace = true
async-trait.workspace = true
chrono.workspace = true
parking_lot.workspace = true
tokio-stream.workspace = true
futures-util.workspace = true
futures = { workspace = true }
once_cell.workspace = true
num_cpus = { workspace = true }  # CPU count detection
dirs = { workspace = true }
sysinfo = { workspace = true }  # Cross-platform CPU, memory, system resource monitoring
tracing.workspace = true
ts-rs.workspace = true  # TypeScript type generation
arc-swap = { workspace = true }           # Wait-free policy publish for SubstrateGovernor (Lane H)
image = { workspace = true }
regex = { workspace = true }

[dev-dependencies]
continuum-academy = { workspace = true, features = ["test-fixtures"] }
continuum-hands = { workspace = true, features = ["test-fixtures"] }  # the in-memory PR host work/submit's tests ensure PRs through
continuum-kernel = { workspace = true, features = ["test-fixtures"] }  # every test build of this crate gets the per-process continuum home (card d11d9827)
tokio = { workspace = true, features = ["test-util"] }
tempfile = { workspace = true }
continuum-client = { workspace = true, features = ["test-fixtures"] }
continuum-positron = { workspace = true, features = ["test-fixtures"] }
continuum-genome = { workspace = true, features = ["test-fixtures"] }
continuum-rooms = { workspace = true, features = ["test-fixtures"] }
continuum-experience = { workspace = true, features = ["test-fixtures"] }
continuum-cognition = { workspace = true, features = ["test-fixtures"] }  # the shared TranscriptEvent fixture (channel_digest::test_event_in)
continuum-grounding = { workspace = true, features = ["test-fixtures"] }  # the shared room-line builder (room_thread::said)
# The real store, so loop tests write obligations through the same data module production uses
# (stop-drain S2: a turn runs only on a confirmed obligation). The store sits below the mind.
continuum-store = { workspace = true, features = ["test-fixtures"] }

[features]
default = []
# The GPU backends are the engine's (llama, candle); the mind forwards them so it builds and
# tests on its own with the same flags core takes.
metal = ["continuum-academy/metal", "continuum-engine/metal", "continuum-live/metal", "continuum-genome/metal"]
cuda = ["continuum-academy/cuda", "continuum-kernel/cuda", "continuum-engine/cuda", "continuum-genome/cuda"]
vulkan = ["continuum-academy/vulkan", "continuum-kernel/vulkan", "continuum-engine/vulkan", "continuum-genome/vulkan"]
stress-tests = ["continuum-academy/stress-tests", "continuum-kernel/stress-tests"]
# Test-only code (fixtures shared with core's integration tests, the heuristic adapter it
# drives); production binaries never build with it.
test-fixtures = ["continuum-academy/test-fixtures", "continuum-kernel/test-fixtures", "continuum-engine/test-fixtures", "continuum-hands/test-fixtures", "continuum-live/test-fixtures", "continuum-perception/test-fixtures", "continuum-genome/test-fixtures", "continuum-experience/test-fixtures"]
