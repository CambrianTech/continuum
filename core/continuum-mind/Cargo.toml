[package]
name = "continuum-mind"
version = "0.1.0"
edition = "2021"
publish = false
repository = "https://github.com/CambrianTech/continuum"
# The mind stamps her captures, continuity and rest seats with the build they ran on
# (CONTINUUM_BUILD_GIT_SHA): core's build script is the one owner of that identity, so the
# mind runs the same script rather than a copy of it.
build = "../continuum-core/build.rs"

[dependencies]
continuum-kernel = { path = "../continuum-kernel" }
continuum-engine = { path = "../continuum-engine" }
continuum-hands = { path = "../continuum-hands" }
continuum-live = { path = "../continuum-live" }
tokio.workspace = true
serde.workspace = true
serde_json.workspace = true
uuid.workspace = true
continuum-base = { path = "../continuum-base" }
continuum-context = { path = "../continuum-context" }
schemars = { version = "0.8", features = ["uuid1"] }
continuum-airc-protocol = { path = "../continuum-airc-protocol" }
continuum-positron = { path = "../continuum-positron" }
continuum-client = { path = "../../client/continuum-client" }
reqwest = { version = "0.12", features = ["json", "multipart", "stream"] }
thiserror.workspace = true
dashmap = "6.1"  # Lock-free concurrent HashMap
inventory = "0.3"
fs2 = "0.4"      # Cross-platform advisory file locks (flock / LockFileEx)
toml = "0.8"
continuum-cli-lifecycle = { path = "../continuum-cli-lifecycle" }  # the CLI's platform lifecycle; its tests must not link this crate
base64 = "0.22"
sha2 = "0.10"   # SHA-256 for OAuth 2.0 PKCE code challenges (RFC 7636) + L1-6 contract canonical hash
airc-core.workspace = true
airc-blobs.workspace = true
airc-protocol.workspace = true
airc-lib.workspace = true
airc-work.workspace = true
async-trait.workspace = true
chrono.workspace = true
axum = "0.8"
parking_lot.workspace = true
tokio-stream.workspace = true
futures-util.workspace = true
futures = "0.3"
once_cell.workspace = true
rayon.workspace = true
num_cpus = "1.16"  # CPU count detection
wide = "0.7"  # Portable SIMD (f32x8) for embedding similarity math — NEON on
              # aarch64 (Mac) / AVX on x86 (Linux grid), guaranteed vectorization
              # at any opt-level (not auto-vec, which only fires in release).
dirs = "5.0"
sysinfo = "0.33"  # Cross-platform CPU, memory, system resource monitoring
candle-core.workspace = true
candle-nn.workspace = true  # For VarBuilder
safetensors.workspace = true  # Model weight files
tracing.workspace = true
ts-rs.workspace = true  # TypeScript type generation
arc-swap = "1.7"           # Wait-free policy publish for SubstrateGovernor (Lane H)
image = "0.25"
regex = "1"
scraper = "0.21"
tempfile = { version = "3", optional = true }  # test-fixtures: the job board's test storage

[dev-dependencies]
tokio = { workspace = true, features = ["test-util"] }
airc-test-fixtures = { path = "../airc-test-fixtures" }  # real two-peer airc loopback for the command pump
tempfile = "3"
continuum-base = { path = "../continuum-base", features = ["test-fixtures"] }
continuum-client = { path = "../../client/continuum-client", features = ["test-fixtures"] }
continuum-positron = { path = "../continuum-positron", features = ["test-fixtures"] }

[features]
default = []
# The GPU backends are the engine's (llama, candle); the mind forwards them so it builds and
# tests on its own with the same flags core takes.
metal = ["continuum-engine/metal", "continuum-live/metal"]
cuda = ["continuum-kernel/cuda", "continuum-engine/cuda"]
vulkan = ["continuum-kernel/vulkan", "continuum-engine/vulkan"]
stress-tests = ["continuum-kernel/stress-tests"]
# Test-only code (fixtures shared with core's integration tests, the heuristic adapter it
# drives); production binaries never build with it.
test-fixtures = ["continuum-base/test-fixtures", "continuum-kernel/test-fixtures", "continuum-engine/test-fixtures", "continuum-hands/test-fixtures", "continuum-live/test-fixtures", "dep:tempfile"]
