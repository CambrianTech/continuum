[package]
name = "continuum-service"
version = "0.1.0"
edition = "2021"
description = "What a node's minds measure of their own service (card 1c157668): the versioned sample, its baseline per configuration and workload, and the detector that says healthy, regressed or not enough evidence. Pure: serde only, no I/O, no global state; the caller owns the state and feeds it samples."

[dependencies]
serde.workspace = true

[dev-dependencies]
serde_json.workspace = true
