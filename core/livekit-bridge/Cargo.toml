[package]
name = "livekit-bridge"
version = "0.1.0"
edition = "2021"
description = "LiveKit WebRTC transport adapter — bridges audio/video between LiveKit rooms and continuum-core"

[[bin]]
name = "livekit-bridge"
path = "src/main.rs"

[dependencies]
# Protocol types shared with continuum-core
continuum-bridge-protocol = { path = "../livekit-protocol" }

# LiveKit WebRTC — the ONLY binary that links webrtc-sys.
# No ort, no fastembed, no candle — zero protobuf conflict.
livekit.workspace = true
livekit-api.workspace = true

# Async runtime
tokio = { workspace = true }

# Serialization
serde = { workspace = true }
serde_json = { workspace = true }

# Async streams
tokio-stream = { workspace = true }
futures-util = "0.3"

# Image encoding (JPEG for vision snapshots)
image = { version = "0.25", default-features = false, features = ["jpeg"] }

# Logging
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
