[package]
name = "continuum-genome"
version = "0.1.0"
edition = "2021"
publish = false
repository = "https://github.com/CambrianTech/continuum"

# The genome (a mind's learned skills: adapters, recall, residency, fitness, gene trials, teach,
# fine-tuning and the training job board), cut out of continuum-mind along MODULE-ARCHITECTURE.md
# section 9.2 (the Dreaming/learning module). It names nothing in cognition or persona; the mind
# re-exports `genome` under its old path.

[dependencies]
continuum-engine-protocol = { path = "../continuum-engine-protocol" }
continuum-process = { path = "../continuum-process" }
continuum-kernel = { path = "../continuum-kernel" }  # the ORM derive names it (recall decisions)
continuum-engine = { path = "../continuum-engine" }
continuum-base = { path = "../continuum-base" }
continuum-host = { path = "../continuum-host" }
tokio.workspace = true
serde.workspace = true
serde_json.workspace = true
uuid.workspace = true
schemars = { workspace = true }
reqwest = { workspace = true, features = ["json", "multipart", "stream"] }
thiserror.workspace = true
dashmap = { workspace = true }  # Lock-free concurrent HashMap
inventory = { workspace = true }  # recall decisions register their protected collection
sha2 = { workspace = true }
async-trait.workspace = true
parking_lot.workspace = true
futures = { workspace = true }
candle-core.workspace = true
candle-nn.workspace = true  # For VarBuilder
tracing.workspace = true
ts-rs.workspace = true  # TypeScript type generation
tempfile = { workspace = true, optional = true }  # test-fixtures: the job board's test storage

[dev-dependencies]
tokio = { workspace = true, features = ["test-util"] }
tempfile = { workspace = true }
axum = { workspace = true }  # tests: a stand-in engine training endpoint
# The lower layers' test helpers (test_home, CountingEmbedder, fresh_adapter, expert fixtures).
continuum-kernel = { path = "../continuum-kernel", features = ["test-fixtures"] }
continuum-engine = { path = "../continuum-engine", features = ["test-fixtures"] }

[features]
default = []
# The GPU backends are the engine's; the genome forwards them so it builds and tests on its own
# with the same flags the mind and core take.
metal = ["continuum-engine/metal"]
cuda = ["continuum-kernel/cuda", "continuum-engine/cuda"]
vulkan = ["continuum-kernel/vulkan", "continuum-engine/vulkan"]
# Test-only code (the recording adapter, the job board's test storage, gene-trial fixtures);
# production binaries never build with it. The mind's test-fixtures forwards here.
test-fixtures = ["continuum-kernel/test-fixtures", "continuum-engine/test-fixtures", "dep:tempfile"]
