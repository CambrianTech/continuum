[package]
name = "continuum-airc-protocol"
version = "0.1.0"
edition = "2021"
description = "Wire-shape types for the substrate's airc command + event protocols. Shared between continuum-core (server-side handler + cross-grid transport) and continuum-client (client-side transport). Substrate-internal coupling (RouteDecision conversion, etc.) stays in continuum-core."

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
uuid = { workspace = true }
# ts-rs generates the TypeScript mirror of the wire envelopes into
# protocol/typescript/. The thin-client WS transport (continuum-core
# ipc::ws ↔ the TS WebSocketTransport) is the first time these shapes
# cross to TypeScript, so the envelope + WS-frame types derive `TS`
# here — one owner of the wire shape, generated (never hand-written)
# on the client side.
ts-rs = { workspace = true }
# airc primitives the shared wire helpers consume (Body, Headers,
# MentionTarget, PeerId, TranscriptEvent). Lets the
# resolve_subscribe / decode_deliver_frame / matches_subscription
# helpers live here instead of being owned by continuum-core — one
# wire-shape source of truth that both substrate AND
# continuum-client consume.
airc-core = { workspace = true }
