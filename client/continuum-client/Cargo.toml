[package]
name = "continuum-client"
version = "0.1.0"
edition = "2021"
description = "Shared client library for connecting to a continuum substrate. Consumed by the CLI directly and by per-language SDKs (Flutter, Swift, Kotlin) via FFI."

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
async-trait = { workspace = true }
thiserror = { workspace = true }
futures = "0.3"
uuid = { workspace = true }
tracing = { workspace = true }

[features]
default = []
# Mock transport for downstream unit tests of consumers (CLI, SDK FFI shims).
test-fixtures = []
