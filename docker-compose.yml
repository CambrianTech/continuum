# Continuum — docker compose up
#
# One command. Tailscale handles TLS automatically (real Let's Encrypt certs).
# Access: https://<hostname>.taila5cb68.ts.net
#
# REQUIRED: Set TS_AUTHKEY in .env file or environment
#   Generate at: https://login.tailscale.com/admin/settings/keys
#   Use reusable + ephemeral key
#
# With GPU: docker compose --profile gpu up
#
# GPU profile requires sibling repos:
#   ../sentinel-ai/    — forge worker source
#   ../forge-alloy/    — alloy recipe definitions

services:

  # ── Tailscale (TLS + mesh networking) ─────────────────────
  # Joins tailnet, provisions real Let's Encrypt certs automatically.
  # Reverse-proxies HTTPS to plain HTTP containers via Docker DNS.
  # No manual certs, no self-signed, no Caddy, no warnings.
  tailscale:
    image: tailscale/tailscale:latest
    hostname: ${TS_HOSTNAME:-bigmama}
    restart: unless-stopped
    environment:
      - TS_AUTHKEY=${TS_AUTHKEY}
      - TS_EXTRA_ARGS=
      - TS_STATE_DIR=/var/lib/tailscale
      - TS_SERVE_CONFIG=/config/tailscale-serve.json
      - TS_USERSPACE=false
    volumes:
      - tailscale-state:/var/lib/tailscale
      - ./docker/tailscale-serve.json:/config/tailscale-serve.json:ro
    devices:
      - /dev/net/tun:/dev/net/tun
    cap_add:
      - net_admin
      - net_raw
    ports:
      - "443:443"     # HTTPS → widget-server
      - "9001:9001"   # WSS → node-server
      - "7880:7880"   # WSS → livekit

  # ── PostgreSQL ────────────────────────────────────────────
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    mem_limit: 512m
    environment:
      POSTGRES_DB: continuum
      POSTGRES_USER: ${POSTGRES_USER:-continuum}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-continuum}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U continuum"]
      interval: 5s
      timeout: 3s
      retries: 5

  # ── Model Init (downloads voice/avatar/scene models on first run) ──
  model-init:
    build:
      context: ./src
      dockerfile: ../docker/model-init.Dockerfile
    image: ghcr.io/cambriantech/continuum-model-init:latest
    volumes:
      - voice-models:/models
    environment:
      - MODELS_DIR=/models
      - HF_TOKEN=${HF_TOKEN:-}
      - WHISPER_MODEL=${WHISPER_MODEL:-large-v3-turbo}

  # ── Continuum Core (Rust) ─────────────────────────────────
  continuum-core:
    build:
      context: ./src/workers
      dockerfile: ../../docker/continuum-core.Dockerfile
    image: ghcr.io/cambriantech/continuum-core:latest
    restart: unless-stopped
    # No mem_limit — Rust PersonaAllocator reads host hardware and decides
    working_dir: /app
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ~/.continuum:/root/.continuum
      - voice-models:/app/models:ro
      - ipc-sockets:/root/.continuum/sockets
    environment:
      - DATABASE_URL=postgres://continuum:continuum@postgres:5432/continuum
    healthcheck:
      test: ["CMD", "test", "-S", "/root/.continuum/sockets/continuum-core.sock"]
      interval: 5s
      timeout: 3s
      retries: 5

  # ── Node Server (TypeScript) ──────────────────────────────
  node-server:
    build:
      context: ./src
      dockerfile: ../docker/node-server.Dockerfile
    image: ghcr.io/cambriantech/continuum-node:latest
    restart: unless-stopped
    depends_on:
      continuum-core:
        condition: service_healthy
      postgres:
        condition: service_healthy
    volumes:
      - ~/.continuum:/root/.continuum
      - ipc-sockets:/root/.continuum/sockets
    environment:
      - DATABASE_URL=postgres://continuum:continuum@postgres:5432/continuum
      - NODE_ENV=production
      - JTAG_SKIP_HTTP=1
      - JTAG_NO_TLS=1

  # ── Widget Server (Vite) ──────────────────────────────────
  widget-server:
    build:
      context: ./src
      dockerfile: ../docker/widget-server.Dockerfile
    image: ghcr.io/cambriantech/continuum-widgets:latest
    restart: unless-stopped
    mem_limit: 512m
    depends_on:
      - node-server
    environment:
      - JTAG_HTTP_PORT=9003
      - JTAG_WEBSOCKET_PORT=9001

  # ── LiveKit (WebRTC) ──────────────────────────────────────
  livekit:
    image: livekit/livekit-server:latest
    restart: unless-stopped
    mem_limit: 256m
    command: ["--dev", "--bind", "0.0.0.0", "--node-ip", "127.0.0.1"]

  # ── Forge Worker (sentinel-ai) ────────────────────────────
  forge-worker:
    build: ../sentinel-ai
    image: ghcr.io/cambriantech/forge-worker:latest
    profiles: ["gpu"]
    mem_limit: 28g
    deploy:
      resources:
        limits:
          memory: 28g
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    volumes:
      - forge-output:/app/output
      - hf-cache:/root/.cache/huggingface
      - models:/app/models
      - ../forge-alloy/examples:/app/alloys:ro
    environment:
      - CUDA_VISIBLE_DEVICES=0
      - HF_TOKEN=${HF_TOKEN:-}
      - PYTHONUNBUFFERED=1

  # ── Inference Server (GPU nodes only) ──────────────────────
  inference:
    image: ghcr.io/ggml-org/llama.cpp:server-cuda
    restart: unless-stopped
    profiles: ["gpu"]
    mem_limit: 8g
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    volumes:
      - models:/models
      - forge-output:/app/output:ro
    command: ["-m", "/models/current.gguf", "-c", "4096", "-ngl", "99", "--port", "8090", "--host", "0.0.0.0"]

volumes:
  pgdata:
  hf-cache:
  forge-output:
  models:
  voice-models:
  ipc-sockets:
  tailscale-state:
