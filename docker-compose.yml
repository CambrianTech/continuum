# Continuum — docker compose up
#
# NORMAL USAGE (pulls pre-built images from GHCR — no local build needed):
#   docker compose pull
#   docker compose up
#
# With GPU:     docker compose --profile gpu up
# Forge only:   docker compose run forge-worker alloys/queue/01-qwen3.5-9b-code-128k.alloy.json
#
# First install:
#   curl -fsSL https://cambriantech.github.io/continuum/install.sh | bash
#
# DEV ONLY (build locally — requires x86_64 Linux for Rust/WebRTC):
#   docker compose build && docker compose up
#
# GPU profile requires sibling repos:
#   ../sentinel-ai/    — forge worker source
#   ../forge-alloy/    — alloy recipe definitions

services:

  # ── PostgreSQL ────────────────────────────────────────────
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    mem_limit: 512m
    environment:
      POSTGRES_DB: continuum
      POSTGRES_USER: ${POSTGRES_USER:-continuum}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-continuum}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U continuum"]
      interval: 5s
      timeout: 3s
      retries: 5

  # ── Model Init (downloads voice/avatar/scene models on first run) ──
  # Populates the voice-models volume. Exits after download.
  # Re-run with: docker compose run model-init
  model-init:
    build:
      context: ./src
      dockerfile: ../docker/model-init.Dockerfile
    image: ghcr.io/cambriantech/continuum-model-init:latest
    volumes:
      - voice-models:/models
    environment:
      - MODELS_DIR=/models
      - HF_TOKEN=${HF_TOKEN:-}
      - WHISPER_MODEL=${WHISPER_MODEL:-large-v3-turbo}

  # ── Continuum Core (Rust) ─────────────────────────────────
  # Voice processing, embeddings, search, inference, IPC
  continuum-core:
    build:
      context: ./src/workers
      dockerfile: ../../docker/continuum-core.Dockerfile
    image: ghcr.io/cambriantech/continuum-core:latest
    restart: unless-stopped
    mem_limit: 2g
    working_dir: /app
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ~/.continuum:/root/.continuum
      - voice-models:/app/models:ro
      - ipc-sockets:/root/.continuum/sockets
    environment:
      - DATABASE_URL=postgresql://continuum:continuum@postgres:5432/continuum
    healthcheck:
      test: ["CMD", "test", "-S", "/root/.continuum/sockets/continuum-core.sock"]
      interval: 5s
      timeout: 3s
      retries: 5

  # ── Node Server (TypeScript) ──────────────────────────────
  # Commands, daemons, WebSocket, orchestration
  node-server:
    build:
      context: ./src
      dockerfile: ../docker/node-server.Dockerfile
    image: ghcr.io/cambriantech/continuum-node:latest
    restart: unless-stopped
    mem_limit: 1g
    depends_on:
      continuum-core:
        condition: service_healthy
      postgres:
        condition: service_healthy
    ports:
      - "9000:9000"   # HTTPS
      - "9001:9001"   # WSS
    volumes:
      - ~/.continuum:/root/.continuum
      - ipc-sockets:/root/.continuum/sockets
    environment:
      - DATABASE_URL=postgresql://continuum:continuum@postgres:5432/continuum
      - NODE_ENV=production

  # ── Widget Server (Vite) ──────────────────────────────────
  # Browser UI — static assets + dev server
  widget-server:
    build:
      context: ./src
      dockerfile: ../docker/widget-server.Dockerfile
    image: ghcr.io/cambriantech/continuum-widgets:latest
    restart: unless-stopped
    mem_limit: 512m
    depends_on:
      - node-server
    ports:
      - "9003:9003"

  # ── LiveKit TLS Proxy (Caddy) ──────────────────────────────
  # Terminates TLS on 7443, proxies WebSocket to LiveKit plain WS.
  # Required because LiveKit doesn't support TLS on its signalling port.
  livekit-tls:
    image: caddy:2-alpine
    restart: unless-stopped
    mem_limit: 128m
    depends_on:
      - livekit
    ports:
      - "7443:7443"
    volumes:
      - ./docker/Caddyfile:/etc/caddy/Caddyfile:ro
      - ./docker/caddy-entrypoint.sh:/entrypoint.sh:ro
      - ~/.continuum:/certs:ro
    entrypoint: ["/entrypoint.sh"]

  # ── LiveKit (WebRTC) ──────────────────────────────────────
  # Voice/video calls between personas (plain WS, internal only)
  livekit:
    image: livekit/livekit-server:latest
    restart: unless-stopped
    mem_limit: 256m
    ports:
      - "7881:7881"   # WebRTC TCP
      - "7882:7882/udp"  # WebRTC UDP
    command: ["--dev", "--bind", "0.0.0.0", "--node-ip", "127.0.0.1"]

  # ── Forge Worker (sentinel-ai) ────────────────────────────
  # GPU model forging — only on machines with NVIDIA GPU
  forge-worker:
    build: ../sentinel-ai
    image: ghcr.io/cambriantech/forge-worker:latest
    profiles: ["gpu"]
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    volumes:
      - forge-output:/app/output
      - hf-cache:/root/.cache/huggingface
      - ../forge-alloy/examples:/app/alloys:ro
    environment:
      - CUDA_VISIBLE_DEVICES=0
      - HF_TOKEN=${HF_TOKEN:-}

  # ── Inference Server ──────────────────────────────────────
  # Serves forged models via llama.cpp
  inference:
    image: ghcr.io/ggml-org/llama.cpp:server
    restart: unless-stopped
    mem_limit: 4g
    ports:
      - "8090:8090"
    volumes:
      - models:/models
    command: ["-m", "/models/current.gguf", "-c", "2048", "-ngl", "99", "--port", "8090"]

volumes:
  pgdata:
  hf-cache:
  forge-output:
  models:
  voice-models:
  ipc-sockets:
